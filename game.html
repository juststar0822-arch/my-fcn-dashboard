<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上新莊歡樂遊戲大廳</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Microsoft JhengHei",sans-serif;
 background:#eef2f7;
 color:#24344b;
}
header{
 background:linear-gradient(135deg,#142b49,#315b85);
 color:white;
 text-align:center;
 padding:30px 15px;
}
header h1{margin:0;font-size:28px}
header p{opacity:.85}
.container{
 max-width:650px;
 margin:auto;
 padding:15px;
}
.card{
 background:white;
 border-radius:18px;
 padding:22px;
 margin-bottom:16px;
 box-shadow:0 4px 15px #00000012;
}
h2{margin-top:0}
input{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:1px solid #ccd5e0;
 border-radius:10px;
 font-size:17px;
}
button{
 border:0;
 background:#17385d;
 color:white;
 padding:13px 20px;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.45}
.full{width:100%}
.gold{background:#c49b47}
.gray{background:#e5eaf1;color:#24344b}
.hidden{display:none!important}
.game{
 border:1px solid #e0e6ed;
 border-radius:14px;
 padding:18px;
 margin:15px 0;
}
.game h3{margin:0 0 10px}
.game p{color:#718096;font-size:14px}
.score{
 font-size:30px;
 font-weight:bold;
 color:#bd8d32;
}
.center{text-align:center}
.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}
.rank{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:13px 5px;
 border-bottom:1px solid #edf0f4;
 gap:8px;
}
.rank small{color:#8290a0}
.me{
 background:#fff7e5;
 border-radius:10px;
 padding:12px;
}
.tiles{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin:20px 0;
}
.tile{
 height:75px;
 background:#dce6f2;
 color:#24344b;
 font-size:28px;
}
.tile.active{background:#f6ce62}
.tile.correct{background:#6ac8a4}
#reactionPad{
 height:200px;
 background:#dce6f2;
 border-radius:18px;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:24px;
 font-weight:bold;
 user-select:none;
 touch-action:manipulation;
}
#reactionPad.wait{
 background:#d96868;
 color:white;
}
#reactionPad.go{
 background:#3cbd89;
 color:white;
}
#toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#17385d;
 color:white;
 padding:12px 20px;
 border-radius:12px;
 display:none;
 z-index:100;
 max-width:90%;
 text-align:center;
}
</style>
</head>

<body>

<header>
<h1>🎉 上新莊歡樂遊戲大廳</h1>
<p>多人挑戰・即時戰績・最終排行榜</p>
</header>

<div class="container">

<!-- 加入房間 -->
<div class="card" id="joinBox">
<h2>🚪 加入遊戲</h2>

<label>遊戲房間代碼</label>
<input id="roomInput" placeholder="例如 XJ1123">

<label>玩家暱稱</label>
<input id="nameInput" placeholder="請輸入名字">

<button class="full gold" id="joinBtn">
加入遊戲
</button>

<p style="color:#8893a2;font-size:13px">
所有玩家輸入相同房間代碼，即可共同參加。
</p>
</div>

<!-- 遊戲主畫面 -->
<div id="main" class="hidden">

<div class="card">
<div class="row">
<div>
<h3 id="roomLabel"></h3>
<p id="welcome"></p>
</div>
<div class="center">
<div>我的總分</div>
<div class="score" id="myScore">0</div>
</div>
</div>

<button class="gray" id="shareBtn">
📤 分享遊戲
</button>

<button class="gray" id="leaveBtn">
離開
</button>
</div>

<!-- 遊戲大廳 -->
<div class="card" id="lobby">

<h2>🎮 選擇挑戰</h2>
<p>每個遊戲可以重複挑戰，系統只記錄最高分。</p>

<div class="game">
<h3>⚡ 反應速度挑戰</h3>
<p>畫面變綠色時立即點擊，反應越快分數越高。</p>
<button class="full" onclick="openGame('reaction')">
開始挑戰
</button>
</div>

<div class="game">
<h3>🧠 記憶力挑戰</h3>
<p>記住方塊亮起的順序，再依照順序點擊。</p>
<button class="full" onclick="openGame('memory')">
開始挑戰
</button>
</div>

<div class="game">
<h3>🔢 猜數字挑戰</h3>
<p>六次機會內猜出1～100的秘密數字。</p>
<button class="full" onclick="openGame('number')">
開始挑戰
</button>
</div>

</div>

<!-- 遊戲區 -->
<div class="card hidden" id="play">

<div class="row">
<h2 id="gameTitle"></h2>
<button class="gray" onclick="backLobby()">返回</button>
</div>

<p id="gameHelp"></p>

<!-- 反應遊戲 -->
<div id="reactionGame" class="hidden">

<div id="reactionPad">
按下準備開始
</div>

<br>

<button class="full" id="reactionStart">
準備開始
</button>

</div>

<!-- 記憶遊戲 -->
<div id="memoryGame" class="hidden">

<h2 class="center" id="memoryLevel">第1關</h2>

<p class="center" id="memoryStatus">
按開始記住亮燈順序
</p>

<div class="tiles" id="memoryTiles"></div>

<button class="full" id="memoryStart">
開始記憶挑戰
</button>

</div>

<!-- 猜數字 -->
<div id="numberGame" class="hidden">

<h2 class="center" id="numberStatus">
還有6次機會
</h2>

<input
type="number"
id="guessInput"
min="1"
max="100"
placeholder="輸入1～100">

<button class="full" id="guessBtn">
送出答案
</button>

<p class="center" id="guessHint"></p>

<button class="full gray hidden" id="numberRestart">
再玩一次
</button>

</div>

</div>

<!-- 排行榜 -->
<div class="card">

<h2>🏆 即時排行榜</h2>

<p style="color:#8290a0;font-size:14px">
三項遊戲最高分加總，滿分3000分。
</p>

<div id="leaderboard">
等待玩家加入...
</div>

</div>

</div>
</div>

<div id="toast"></div>

<script type="module">

// =====================================
// Firebase 設定區
// 請替換成你自己的 Firebase 資料
// =====================================

const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 projectId: "YOUR_PROJECT_ID",
 appId: "YOUR_APP_ID"
};

// =====================================

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 signInAnonymously,
 onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 getDoc,
 collection,
 onSnapshot,
 serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = id => document.getElementById(id);

let db,auth,uid="";
let room="",playerName="";
let scores={
 reaction:0,
 memory:0,
 number:0
};

let unsubscribe=null;
let currentGame="";
let gameRun=0;

// =====================================
// 提示訊息
// =====================================

function toast(msg){
 const box=$("toast");
 box.textContent=msg;
 box.style.display="block";
 setTimeout(()=>{
  box.style.display="none";
 },3000);
}

function show(id,visible=true){
 $(id).classList.toggle("hidden",!visible);
}

// =====================================
// Firebase 初始化
// =====================================

const configReady=
 !firebaseConfig.apiKey.startsWith("YOUR_") &&
 !firebaseConfig.projectId.startsWith("YOUR_");

if(configReady){

 const app=initializeApp(firebaseConfig);

 db=getFirestore(app);
 auth=getAuth(app);

 onAuthStateChanged(auth,user=>{
  if(user)uid=user.uid;
 });

 signInAnonymously(auth).catch(error=>{
  toast("登入失敗："+error.message);
 });

}else{
 toast("請先設定 Firebase");
}

// =====================================
// 房間
// =====================================

const params=new URLSearchParams(location.search);

if(params.get("room")){
 $("roomInput").value=params.get("room");
}

$("nameInput").value=
 localStorage.getItem("partyPlayerName")||"";

$("joinBtn").onclick=async()=>{

 if(!configReady){
  toast("請先設定 Firebase");
  return;
 }

 if(!uid){
  toast("系統登入中，請稍後");
  return;
 }

 const r=$("roomInput").value
 .trim()
 .toUpperCase()
 .replace(/[^A-Z0-9_-]/g,"")
 .slice(0,20);

 const n=$("nameInput").value.trim().slice(0,16);

 if(!r||!n){
  toast("請輸入房間代碼及名字");
  return;
 }

 room=r;
 playerName=n;

 localStorage.setItem("partyPlayerName",n);

 const playerRef=doc(
  db,
  "rooms",
  room,
  "players",
  uid
 );

 $("joinBtn").disabled=true;

 try{

  const existing=await getDoc(playerRef);

  if(existing.exists()){
   const old=existing.data().scores||{};
   scores={
    reaction:Number(old.reaction)||0,
    memory:Number(old.memory)||0,
    number:Number(old.number)||0
   };
  }else{
   scores={reaction:0,memory:0,number:0};
  }

  await setDoc(playerRef,{
   name:playerName,
   scores:scores,
   updatedAt:serverTimestamp()
  },{merge:true});

  $("roomLabel").textContent="房間："+room;
  $("welcome").textContent="歡迎，"+playerName;

  show("joinBox",false);
  show("main",true);

  history.replaceState(
   {},
   "",
   location.pathname+"?room="+encodeURIComponent(room)
  );

  listenRanking();

 }catch(error){
  toast("加入失敗："+error.message);
 }finally{
  $("joinBtn").disabled=false;
 }

};

// =====================================
// 即時排行榜
// =====================================

function listenRanking(){

 if(unsubscribe)unsubscribe();

 unsubscribe=onSnapshot(
  collection(db,"rooms",room,"players"),
  snapshot=>{

   let players=[];

   snapshot.forEach(item=>{

    const data=item.data();
    const s=data.scores||{};

    const total=
     (Number(s.reaction)||0)+
     (Number(s.memory)||0)+
     (Number(s.number)||0);

    players.push({
     id:item.id,
     name:data.name||"玩家",
     scores:s,
     total:total
    });

    if(item.id===uid){
     scores={
      reaction:Number(s.reaction)||0,
      memory:Number(s.memory)||0,
      number:Number(s.number)||0
     };
     $("myScore").textContent=total.toLocaleString();
    }

   });

   players.sort((a,b)=>
    b.total-a.total||
    a.name.localeCompare(b.name,"zh-TW")
   );

   const board=$("leaderboard");
   board.replaceChildren();

   players.forEach((p,index)=>{

    const row=document.createElement("div");
    row.className="rank";

    if(p.id===uid)row.classList.add("me");

    const left=document.createElement("div");

    const medal=
     index===0?"🥇":
     index===1?"🥈":
     index===2?"🥉":
     "#"+(index+1);

    left.textContent=
     medal+" "+p.name+
     (p.id===uid?"（我）":"");

    const right=document.createElement("div");
    right.style.textAlign="right";

    const total=document.createElement("strong");
    total.textContent=p.total.toLocaleString()+" 分";

    const detail=document.createElement("small");
    detail.textContent=
     "⚡"+(p.scores.reaction||0)+
     " 🧠"+(p.scores.memory||0)+
     " 🔢"+(p.scores.number||0);

    right.append(total,document.createElement("br"),detail);
    row.append(left,right);
    board.append(row);

   });

   if(!players.length){
    board.textContent="尚無玩家";
   }

  },
  error=>{
   toast("排行榜讀取失敗："+error.message);
  }
 );

}

// =====================================
// 分享房間
// =====================================

$("shareBtn").onclick=async()=>{

 const url=
  location.origin+
  location.pathname+
  "?room="+encodeURIComponent(room);

 try{

  if(navigator.share){
   await navigator.share({
    title:"上新莊歡樂遊戲",
    url:url
   });
  }else{
   await navigator.clipboard.writeText(url);
   toast("連結已複製");
  }

 }catch(error){
  if(error.name!=="AbortError"){
   toast("請複製網址分享");
  }
 }

};

$("leaveBtn").onclick=()=>{

 stopGame();

 if(unsubscribe)unsubscribe();

 show("main",false);
 show("joinBox",true);

 room="";

 history.replaceState({},'',location.pathname);

};

// =====================================
// 成績儲存
// =====================================

async function award(type,points){

 points=Math.max(0,Math.min(1000,Math.round(points)));

 if(points<=scores[type]){
  toast("本次"+points+"分，未超過最高紀錄");
  return;
 }

 scores[type]=points;

 try{

  await setDoc(
   doc(db,"rooms",room,"players",uid),
   {
    name:playerName,
    scores:{...scores},
    updatedAt:serverTimestamp()
   },
   {merge:true}
  );

  toast("🎉 新紀錄！"+points+"分");

 }catch(error){
  toast("儲存失敗："+error.message);
 }

}

// =====================================
// 遊戲切換
// =====================================

function stopGame(){
 gameRun++;
 clearTimeout(reactionTimer);
 reactionState="idle";
 memoryBusy=false;
}

window.openGame=function(type){

 stopGame();

 currentGame=type;

 show("lobby",false);
 show("play",true);

 ["reaction","memory","number"].forEach(g=>{
  show(g+"Game",g===type);
 });

 const titles={
  reaction:"⚡ 反應速度",
  memory:"🧠 記憶力挑戰",
  number:"🔢 猜數字"
 };

 $("gameTitle").textContent=titles[type];

 if(type==="reaction")resetReaction();
 if(type==="memory")resetMemory();
 if(type==="number")resetNumber();

};

window.backLobby=function(){

 stopGame();

 currentGame="";

 show("play",false);
 show("lobby",true);

};

// =====================================
// 遊戲一：反應速度
// =====================================

let reactionTimer=null;
let reactionState="idle";
let reactionStartTime=0;

function resetReaction(){

 reactionState="idle";

 $("reactionPad").className="";
 $("reactionPad").textContent="按下準備開始";

 $("reactionStart").disabled=false;

}

$("reactionStart").onclick=()=>{

 if(reactionState==="wait"||reactionState==="go")return;

 reactionState="wait";

 $("reactionStart").disabled=true;

 $("reactionPad").className="wait";
 $("reactionPad").textContent="等待綠燈...";

 const run=++gameRun;

 reactionTimer=setTimeout(()=>{

  if(run!==gameRun)return;

  reactionState="go";

  reactionStartTime=performance.now();

  $("reactionPad").className="go";
  $("reactionPad").textContent="快點！";

 },1500+Math.random()*2500);

};

$("reactionPad").onclick=()=>{

 if(reactionState==="wait"){

  clearTimeout(reactionTimer);
  gameRun++;

  reactionState="done";

  $("reactionPad").className="";
  $("reactionPad").textContent="太早按了！0分";

  $("reactionStart").disabled=false;

 }else if(reactionState==="go"){

  const ms=Math.round(
   performance.now()-reactionStartTime
  );

  reactionState="done";

  const points=Math.max(
   100,
   Math.min(1000,Math.round(1200-ms))
  );

  $("reactionPad").className="";
  $("reactionPad").textContent=
   ms+"毫秒，獲得"+points+"分";

  $("reactionStart").disabled=false;

  award("reaction",points);

 }

};

// =====================================
// 遊戲二：記憶方塊
// =====================================

let memorySequence=[];
let memoryInput=0;
let memoryLevel=0;
let memoryBusy=false;

const tiles=[];

for(let i=0;i<9;i++){

 const btn=document.createElement("button");

 btn.className="tile";
 btn.textContent="●";

 btn.onclick=()=>tapMemory(i);

 $("memoryTiles").append(btn);

 tiles.push(btn);

}

function resetMemory(){

 memorySequence=[];
 memoryInput=0;
 memoryLevel=0;
 memoryBusy=false;

 $("memoryLevel").textContent="第1關";
 $("memoryStatus").textContent="按開始記住順序";

 $("memoryStart").disabled=false;

 tiles.forEach(t=>t.className="tile");

}

const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function nextMemory(){

 const run=++gameRun;

 memoryBusy=true;
 memoryLevel++;
 memoryInput=0;

 memorySequence.push(
  Math.floor(Math.random()*9)
 );

 $("memoryLevel").textContent="第"+memoryLevel+"關";
 $("memoryStatus").textContent="請記住亮燈順序";

 await sleep(650);

 for(const index of memorySequence){

  if(run!==gameRun)return;

  tiles[index].classList.add("active");

  await sleep(480);

  tiles[index].classList.remove("active");

  await sleep(240);

 }

 if(run!==gameRun)return;

 memoryBusy=false;

 $("memoryStatus").textContent="換你點擊方塊！";

}

$("memoryStart").onclick=()=>{

 resetMemory();

 $("memoryStart").disabled=true;

 nextMemory();

};

function tapMemory(index){

 if(currentGame!=="memory"||memoryBusy||!memoryLevel)return;

 tiles[index].classList.add("correct");

 setTimeout(()=>{
  tiles[index].classList.remove("correct");
 },180);

 if(index!==memorySequence[memoryInput]){

  memoryBusy=true;

  const passed=memoryLevel-1;

  $("memoryStatus").textContent=
   "挑戰結束！通過"+passed+"關";

  award("memory",Math.min(1000,passed*150));

  $("memoryStart").disabled=false;

  return;

 }

 memoryInput++;

 if(memoryInput===memorySequence.length){

  memoryBusy=true;

  if(memoryLevel>=7){

   $("memoryStatus").textContent="🎉 完美過關！";

   award("memory",1000);

   $("memoryStart").disabled=false;

  }else{

   $("memoryStatus").textContent="答對！下一關";

   const run=gameRun;

   setTimeout(()=>{
    if(currentGame==="memory"&&run===gameRun){
     nextMemory();
    }
   },700);

  }

 }

}

// =====================================
// 遊戲三：猜數字
// =====================================

let secretNumber=0;
let guessCount=0;

function resetNumber(){

 secretNumber=1+Math.floor(Math.random()*100);
 guessCount=0;

 $("numberStatus").textContent="還有6次機會";
 $("guessHint").textContent="";

 $("guessInput").value="";
 $("guessInput").disabled=false;
 $("guessBtn").disabled=false;

 show("numberRestart",false);

}

$("guessBtn").onclick=()=>{

 const n=Number($("guessInput").value);

 if(
  $("guessInput").value.trim()===""||
  !Number.isInteger(n)||
  n<1||
  n>100
 ){
  toast("請輸入1～100的整數");
  return;
 }

 guessCount++;

 if(n===secretNumber){

  const points=1000-(guessCount-1)*150;

  $("guessHint").textContent=
   "🎉 猜中了！第"+guessCount+
   "次成功，獲得"+points+"分";

  award("number",points);

  endNumber();

 }else if(guessCount>=6){

  $("guessHint").textContent=
   "挑戰結束！正確答案："+secretNumber;

  endNumber();

 }else{

  $("guessHint").textContent=
   n<secretNumber?"太小了 ⬆️":"太大了 ⬇️";

  $("numberStatus").textContent=
   "還有"+(6-guessCount)+"次機會";

  $("guessInput").value="";

 }

};

$("guessInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!$("guessBtn").disabled){
  $("guessBtn").click();
 }
});

function endNumber(){

 $("guessInput").disabled=true;
 $("guessBtn").disabled=true;

 show("numberRestart",true);

}

$("numberRestart").onclick=resetNumber;

</script>

</body>
</html>
