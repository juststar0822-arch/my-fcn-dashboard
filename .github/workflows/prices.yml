name: Update Stock Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,5,9,13,17,21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-stock-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch stock prices
        run: python update_prices.py

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update stock prices"
            git push
          else
            echo "No price changes"
          fi