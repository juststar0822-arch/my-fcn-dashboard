<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCN 每日報價清單</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
        background: #eef3f8;
        color: #17324d;
    }

    .app {
        max-width: 1500px;
        margin: 0 auto;
        padding: 28px;
    }

    .control-panel {
        background: white;
        border-radius: 20px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 8px 30px rgba(24, 62, 98, .10);
    }

    .control-title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 8px;
        color: #0b3157;
    }

    .control-desc {
        font-size: 15px;
        color: #6b7d90;
        line-height: 1.7;
        margin-bottom: 16px;
    }

    textarea {
        width: 100%;
        height: 180px;
        resize: vertical;
        border: 2px solid #d8e2ed;
        border-radius: 14px;
        padding: 15px;
        font-size: 14px;
        line-height: 1.6;
        outline: none;
        font-family: Consolas, "Microsoft JhengHei", monospace;
    }

    textarea:focus {
        border-color: #2878b8;
    }

    .buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
    }

    button {
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: .2s;
    }

    .btn-main {
        background: #0d4778;
        color: white;
    }

    .btn-main:hover {
        background: #082f53;
    }

    .btn-second {
        background: #e8f0f7;
        color: #17476f;
    }

    .btn-second:hover {
        background: #d7e6f3;
    }

    .btn-gold {
        background: #d5a94f;
        color: white;
    }

    /* =========================
       報價版面
    ========================== */

    #quoteArea {
        background:
            radial-gradient(circle at 90% 10%, rgba(52,145,211,.15), transparent 30%),
            linear-gradient(135deg, #082a48, #0d416c 55%, #082a48);
        border-radius: 22px;
        padding: 30px;
        overflow: hidden;
        box-shadow: 0 12px 35px rgba(8,42,72,.20);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(255,255,255,.20);
        margin-bottom: 20px;
    }

    .brand-small {
        font-size: 14px;
        letter-spacing: 3px;
        color: #d5b66a;
        margin-bottom: 5px;
    }

    .title {
        font-size: 36px;
        font-weight: 900;
        color: white;
        letter-spacing: 2px;
    }

    .subtitle {
        margin-top: 8px;
        font-size: 15px;
        color: #a8c6df;
    }

    .date-box {
        text-align: right;
        color: white;
    }

    .date-box .today {
        font-size: 28px;
        font-weight: 800;
        color: #f1cc72;
    }

    .date-box .update {
        font-size: 13px;
        color: #9eb9cd;
        margin-top: 5px;
    }

    .summary {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
    }

    .summary-card {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px;
        padding: 10px 16px;
        color: white;
    }

    .summary-card span:first-child {
        color: #a8c6df;
        font-size: 12px;
    }

    .summary-card strong {
        display: block;
        font-size: 20px;
        margin-top: 3px;
        color: #f1cc72;
    }

    .quote-list {
        display: grid;
        gap: 12px;
    }

    .quote-row {
        background: rgba(255,255,255,.97);
        border-radius: 16px;
        padding: 15px 18px;
        display: grid;
        grid-template-columns:
            72px
            78px
            78px
            110px
            110px
            90px
            110px
            1fr;
        align-items: center;
        gap: 10px;
        border-left: 5px solid #d8ad55;
        box-shadow: 0 5px 14px rgba(0,0,0,.08);
    }

    .cell {
        min-width: 0;
    }

    .label {
        font-size: 11px;
        color: #8796a5;
        margin-bottom: 4px;
    }

    .value {
        font-size: 16px;
        font-weight: 800;
        color: #17324d;
    }

    .coupon .value {
        color: #c17b05;
        font-size: 20px;
    }

    .strike .value {
        color: #137454;
        font-size: 18px;
    }

    .ko .value {
        color: #1769aa;
    }

    .stocks {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-start;
    }

    .stock {
        background: #e9f1f8;
        color: #153c60;
        border: 1px solid #d4e1ec;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
    }

    .stock.hot {
        background: #fff4d7;
        border-color: #ecd394;
        color: #996716;
    }

    .footer-note {
        color: #9eb9cd;
        font-size: 12px;
        margin-top: 18px;
        border-top: 1px solid rgba(255,255,255,.14);
        padding-top: 15px;
        line-height: 1.7;
    }

    .empty {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255,255,255,.65);
        border: 1px dashed rgba(255,255,255,.25);
        border-radius: 14px;
    }

    @media(max-width: 1000px) {
        .quote-row {
            grid-template-columns: repeat(4, 1fr);
        }

        .stocks {
            grid-column: span 4;
        }
    }

    @media(max-width: 600px) {
        .app {
            padding: 12px;
        }

        #quoteArea {
            padding: 18px;
        }

        .header {
            align-items: flex-start;
            flex-direction: column;
        }

        .date-box {
            text-align: left;
        }

        .title {
            font-size: 28px;
        }

        .quote-row {
            grid-template-columns: repeat(2, 1fr);
        }

        .stocks {
            grid-column: span 2;
        }
    }

    @media print {
        body {
            background: white;
        }

        .control-panel {
            display: none;
        }

        .app {
            padding: 0;
            max-width: none;
        }

        #quoteArea {
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div class="control-panel">

        <div class="control-title">
            FCN 每日報價產生器
        </div>

        <div class="control-desc">
            直接從 Excel 複製 FCN 報價資料貼到下方即可。<br>
            支援「有標題列」或直接貼資料列。
        </div>

        <textarea id="pasteArea"
placeholder="可直接從 Excel 複製貼上，例如：

日期	Type	Currency	Tenor (M)	Coupon	Coupon Period	Strike	KI	KI Freq	KO	KO Freq	KO Start	Memory KO	U1	U2	U3
6/16	FCN	USD	8	12.00%	1	42.15%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	PLTR
6/16	FCN	USD	8	12.00%	1	43.63%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	GOOGL"></textarea>

        <div class="buttons">
            <button class="btn-main" onclick="generateQuote()">
                生成每日報價
            </button>

            <button class="btn-second" onclick="loadExample()">
                載入範例
            </button>

            <button class="btn-second" onclick="clearAll()">
                清空
            </button>

            <button class="btn-gold" onclick="window.print()">
                列印 / 存成 PDF
            </button>
        </div>

    </div>


    <div id="quoteArea">

        <div class="header">

            <div>
                <div class="brand-small">
                    STRUCTURED PRODUCTS
                </div>

                <div class="title">
                    FCN 每日報價清單
                </div>

                <div class="subtitle">
                    精選條件｜快速比較｜掌握每日投資機會
                </div>
            </div>

            <div class="date-box">
                <div class="today" id="today"></div>
                <div class="update">DAILY INDICATIVE TERMS</div>
            </div>

        </div>


        <div class="summary" id="summary"></div>


        <div class="quote-list" id="quoteList">
            <div class="empty">
                將 FCN 商品報價貼到上方後，按「生成每日報價」
            </div>
        </div>


        <div class="footer-note">
            ※ 本頁資料僅供內部報價整理與商品條件比較使用，實際成交條件仍以交易時最終報價及相關文件為準。
        </div>

    </div>

</div>


<script>

/* =====================================================
   預設欄位順序
   依照你照片中的報價格式
===================================================== */

const defaultColumns = [
    "日期",
    "Type",
    "Currency",
    "Tenor",
    "Coupon",
    "CouponPeriod",
    "Strike",
    "KI",
    "KIFreq",
    "KO",
    "KOFreq",
    "KOStart",
    "MemoryKO",
    "U1",
    "U2",
    "U3",
    "U4"
];


/* =====================================================
   日期
===================================================== */

function setToday() {

    const now = new Date();

    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");

    document.getElementById("today").innerText =
        `${y}.${m}.${d}`;

}

setToday();


/* =====================================================
   判斷是否為標題列
===================================================== */

function isHeaderRow(row) {

    const text = row
        .join(" ")
        .toLowerCase();

    const keywords = [
        "date",
        "日期",
        "type",
        "currency",
        "curr",
        "tenor",
        "coupon",
        "strike",
        "memory",
        "u1"
    ];

    return keywords.filter(k => text.includes(k)).length >= 3;

}


/* =====================================================
   清理標題名稱
===================================================== */

function normalizeHeader(header) {

    let h = header
        .trim()
        .replace(/\s+/g, "")
        .replace(/\(.*?\)/g, "")
        .toLowerCase();

    const mapping = {

        "日期": "日期",
        "date": "日期",

        "type": "Type",

        "currency": "Currency",
        "ccy": "Currency",

        "tenor": "Tenor",
        "tenorm": "Tenor",

        "coupon": "Coupon",

        "couponperiod": "CouponPeriod",
        "period": "CouponPeriod",

        "strike": "Strike",

        "ki": "KI",

        "kifreq": "KIFreq",

        "ko": "KO",

        "kofreq": "KOFreq",

        "kostart": "KOStart",

        "memoryko": "MemoryKO",
        "memory": "MemoryKO",

        "u1": "U1",
        "u2": "U2",
        "u3": "U3",
        "u4": "U4"

    };

    return mapping[h] || header;

}


/* =====================================================
   解析貼上的 Excel 資料
===================================================== */

function parseData(text) {

    let lines = text
        .trim()
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

    if (!lines.length) return [];

    let rows = lines.map(line => {

        // Excel 貼上通常是 TAB
        if (line.includes("\t")) {
            return line.split("\t").map(v => v.trim());
        }

        // 也支援逗號
        return line.split(",").map(v => v.trim());

    });

    let headers = defaultColumns;

    if (isHeaderRow(rows[0])) {

        headers =
            rows.shift()
                .map(normalizeHeader);

    }

    return rows.map(row => {

        let obj = {};

        headers.forEach((header, index) => {
            obj[header] = row[index] ?? "";
        });

        return obj;

    });

}


/* =====================================================
   商品標的
===================================================== */

function buildStocks(item) {

    const stockList = [
        item.U1,
        item.U2,
        item.U3,
        item.U4
    ].filter(v =>
        v &&
        v !== "-" &&
        v.toUpperCase() !== "NA"
    );

    if (!stockList.length) {
        return `<span class="stock">－</span>`;
    }

    return stockList
        .map((stock, index) => {

            const hotClass =
                index === 0
                ? "hot"
                : "";

            return `
                <span class="stock ${hotClass}">
                    ${escapeHTML(stock)}
                </span>
            `;

        })
        .join("");

}


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value) {

    if (value === undefined || value === null) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   產生報價
===================================================== */

function generateQuote() {

    const text =
        document
            .getElementById("pasteArea")
            .value;

    if (!text.trim()) {
        alert("請先貼上 FCN 報價資料");
        return;
    }

    const data = parseData(text);

    const list =
        document.getElementById("quoteList");

    list.innerHTML = "";


    data.forEach((item, index) => {

        const row =
            document.createElement("div");

        row.className = "quote-row";

        row.innerHTML = `

            <div class="cell">
                <div class="label">幣別</div>
                <div class="value">
                    ${escapeHTML(item.Currency || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">天期</div>
                <div class="value">
                    ${escapeHTML(item.Tenor || "-")}M
                </div>
            </div>


            <div class="cell coupon">
                <div class="label">年化 Coupon</div>
                <div class="value">
                    ${escapeHTML(item.Coupon || "-")}
                </div>
            </div>


            <div class="cell strike">
                <div class="label">Strike</div>
                <div class="value">
                    ${escapeHTML(item.Strike || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">KI</div>
                <div class="value">
                    ${escapeHTML(item.KI || "NA")}
                </div>
            </div>


            <div class="cell ko">
                <div class="label">KO</div>
                <div class="value">
                    ${escapeHTML(item.KO || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">KO 頻率</div>
                <div class="value">
                    ${escapeHTML(item.KOFreq || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">連結標的</div>

                <div class="stocks">
                    ${buildStocks(item)}
                </div>
            </div>

        `;

        list.appendChild(row);

    });


    buildSummary(data);

}


/* =====================================================
   上方統計
===================================================== */

function buildSummary(data) {

    const summary =
        document.getElementById("summary");

    const currencies =
        [...new Set(
            data
                .map(x => x.Currency)
                .filter(Boolean)
        )];

    const tenors =
        [...new Set(
            data
                .map(x => x.Tenor)
                .filter(Boolean)
        )];

    const coupons =
        data
            .map(x =>
                parseFloat(
                    String(x.Coupon)
                    .replace("%", "")
                )
            )
            .filter(x => !isNaN(x));

    const maxCoupon =
        coupons.length
            ? Math.max(...coupons).toFixed(2) + "%"
            : "-";


    summary.innerHTML = `

        <div class="summary-card">
            <span>今日報價</span>
            <strong>${data.length} 組</strong>
        </div>

        <div class="summary-card">
            <span>幣別</span>
            <strong>${currencies.join(" / ") || "-"}</strong>
        </div>

        <div class="summary-card">
            <span>天期</span>
            <strong>${tenors.map(x => x + "M").join(" / ") || "-"}</strong>
        </div>

        <div class="summary-card">
            <span>最高 Coupon</span>
            <strong>${maxCoupon}</strong>
        </div>

    `;

}


/* =====================================================
   範例資料
===================================================== */

function loadExample() {

const example =
`日期	Type	Currency	Tenor (M)	Coupon	Coupon Period	Strike	KI	KI Freq	KO	KO Freq	KO Start	Memory KO	U1	U2	U3
6/16	FCN	USD	8	12.00%	1	42.15%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	PLTR
6/16	FCN	USD	8	12.00%	1	43.63%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	GOOGL
6/16	FCN	USD	8	12.00%	1	41.79%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	ORCL
6/16	FCN	USD	8	12.00%	1	43.16%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	ADBE
6/16	FCN	USD	8	12.00%	1	43.72%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	META
6/16	FCN	USD	6	12.00%	1	46.08%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	PLTR
6/16	FCN	USD	6	12.00%	1	47.68%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	GOOGL
6/16	FCN	USD	6	12.00%	1	46.15%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	ORCL
6/16	FCN	USD	6	12.00%	1	47.77%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	ADBE
6/16	FCN	USD	6	12.00%	1	47.85%	NA	NA	100.00%	Daily	1	Yes	TSM	MU	META`;

    document
        .getElementById("pasteArea")
        .value = example;

    generateQuote();

}


/* =====================================================
   清空
===================================================== */

function clearAll() {

    document
        .getElementById("pasteArea")
        .value = "";

    document
        .getElementById("quoteList")
        .innerHTML = `
            <div class="empty">
                將 FCN 商品報價貼到上方後，按「生成每日報價」
            </div>
        `;

    document
        .getElementById("summary")
        .innerHTML = "";

}

</script>

</body>
</html>
