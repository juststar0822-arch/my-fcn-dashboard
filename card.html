<script>

/* =====================================================
   從 Best 抓發行機構
   GS (12.51%) → GS
===================================================== */
function extractIssuer(text) {
    if (!text) return "";

    return String(text)
        .replace(/\(.*?\)/g, "")
        .trim();
}


/* =====================================================
   從 Best 抓括號內數值
   GS (12.51%) → 12.51%
===================================================== */
function extractBestValue(text) {
    if (!text) return "";

    const match = String(text).match(/\(([^()]+)\)/);

    return match ? match[1].trim() : "";
}


/* =====================================================
   Header 標準化
===================================================== */
function normalizeHeader(text) {

    let h = String(text || "")
        .replace(/\r/g, "")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

    const map = {
        "best (30 萬)": "Best30",
        "best (30萬)": "Best30",
        "best 30萬": "Best30",
        "best30萬": "Best30",

        "best (20 萬)": "Best20",
        "best (20萬)": "Best20",
        "best 20萬": "Best20",
        "best20萬": "Best20",

        "solve": "Solve",
        "type": "Type",
        "currency": "Currency",
        "tenor (m)": "Tenor",
        "tenor(m)": "Tenor",
        "tenor": "Tenor",
        "coupon": "Coupon",
        "coupon period": "CouponPeriod",
        "strike": "Strike",
        "ki": "KI",
        "ki freq": "KIFreq",
        "ko": "KO",
        "ko freq": "KOFreq",
        "ko start": "KOStart",
        "memory ko": "MemoryKO",
        "u1": "U1",
        "u2": "U2",
        "u3": "U3",
        "u4": "U4"
    };

    return map[h] || text.trim();
}


/* =====================================================
   Solve 名稱標準化
===================================================== */
function normalizeSolve(text) {

    if (!text) return "";

    let s = String(text)
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/_/g, "")
        .replace(/-/g, "");

    const map = {
        "coupon": "Coupon",
        "strike": "Strike",
        "ki": "KI",
        "kifreq": "KIFreq",
        "ko": "KO",
        "kofreq": "KOFreq",
        "kostart": "KOStart",
        "tenor": "Tenor",
        "couponperiod": "CouponPeriod",
        "memoryko": "MemoryKO"
    };

    return map[s] || "";
}


/* =====================================================
   判斷是否 Header
===================================================== */
function looksLikeHeader(row) {

    const text = row.join(" ").toLowerCase();

    const keywords = [
        "best",
        "solve",
        "type",
        "currency",
        "tenor",
        "coupon",
        "strike",
        "ki",
        "ko",
        "u1"
    ];

    let count = 0;

    keywords.forEach(k => {
        if (text.includes(k)) count++;
    });

    return count >= 4;
}


/* =====================================================
   乾淨切割一列
   Excel / Outlook 複製都盡量兼容
===================================================== */
function splitRow(line) {

    // 優先處理 Tab
    if (line.includes("\t")) {

        return line
            .split("\t")
            .map(v =>
                String(v)
                    .replace(/\r/g, "")
                    .replace(/\n/g, " ")
                    .replace(/\s+/g, " ")
                    .trim()
            );
    }

    // 備援：連續 2 個以上空白視為欄位分隔
    return line
        .trim()
        .split(/\s{2,}/)
        .map(v =>
            String(v)
                .replace(/\r/g, "")
                .replace(/\n/g, " ")
                .replace(/\s+/g, " ")
                .trim()
        );
}


/* =====================================================
   修正欄數
===================================================== */
function normalizeRowLength(row, expectedLength) {

    let result = [...row];

    // 欄位太少 → 補空白
    while (result.length < expectedLength) {
        result.push("");
    }

    // 欄位太多 → 最後多出來的合併到最後一欄
    if (result.length > expectedLength) {

        const fixed = result.slice(0, expectedLength - 1);

        fixed.push(
            result
                .slice(expectedLength - 1)
                .join(" ")
        );

        result = fixed;
    }

    return result;
}


/* =====================================================
   解析資料
===================================================== */
function parseData(text) {

    let rawLines = String(text)
        .replace(/\u00A0/g, " ")
        .split(/\r?\n/)
        .map(x => x.trimEnd());

    // 移除空白列
    rawLines = rawLines.filter(line => line.trim() !== "");

    if (!rawLines.length) return [];


    let rows = rawLines.map(splitRow);


    let headers = [];

    if (looksLikeHeader(rows[0])) {

        headers = rows.shift().map(normalizeHeader);

    } else {

        headers = [
            "Best30",
            "Best20",
            "Solve",
            "Type",
            "Currency",
            "Tenor",
            "Coupon",
            "CouponPeriod",
            "Strike",
            "KI",
            "KIFreq",
            "KO",
            "KOFreq",
            "KOStart",
            "MemoryKO",
            "U1",
            "U2",
            "U3",
            "U4"
        ];
    }


    return rows
        .map(row => {

            row = normalizeRowLength(
                row,
                headers.length
            );

            let obj = {};

            headers.forEach((header, i) => {
                obj[header] = row[i] || "";
            });


            const bestText =
                obj.Best30 ||
                obj.Best20 ||
                "";

            const bestValue =
                extractBestValue(bestText);

            const issuer =
                extractIssuer(bestText);


            obj.Issuer = issuer;
            obj.BestValue = bestValue;


            const solveField =
                normalizeSolve(obj.Solve);

            obj.SolveField = solveField;


            // Solve 指向哪一欄，就補哪一欄
            if (solveField && bestValue) {

                const original =
                    String(
                        obj[solveField] || ""
                    ).trim();

                if (
                    original === "" ||
                    original.toUpperCase() === "NA"
                ) {
                    obj[solveField] = bestValue;
                }
            }


            return obj;
        })
        .filter(item => {

            // 過濾不是商品資料的雜訊列
            return (
                item.Type ||
                item.Currency ||
                item.U1 ||
                item.Best30 ||
                item.Best20
            );
        });
}


/* =====================================================
   顯示標的
===================================================== */
function buildStocks(item) {

    const stocks = [
        item.U1,
        item.U2,
        item.U3,
        item.U4
    ].filter(v => {
        if (!v) return false;

        const x = String(v).trim().toUpperCase();

        return x !== "" &&
               x !== "NA" &&
               x !== "-";
    });

    if (!stocks.length) {
        return `<span class="stock">-</span>`;
    }

    return stocks
        .map(stock => `
            <span class="stock">
                ${escapeHTML(stock)}
            </span>
        `)
        .join("");
}


/* =====================================================
   BEST 標示
===================================================== */
function solveHint(item, field) {

    if (item.SolveField === field) {

        return `
            <div class="solve-tag">
                BEST
            </div>
        `;
    }

    return "";
}


/* =====================================================
   產生報價
===================================================== */
function generateQuote() {

    const text =
        document
            .getElementById("pasteArea")
            .value;

    if (!text.trim()) {
        alert("請先貼上 FCN 報價資料");
        return;
    }

    const data = parseData(text);

    if (!data.length) {
        alert("沒有讀取到有效的 FCN 商品資料");
        return;
    }

    const list =
        document.getElementById("quoteList");

    list.innerHTML = "";


    data.forEach(item => {

        const row =
            document.createElement("div");

        row.className = "quote-row";


        row.innerHTML = `

            <div class="cell">
                <div class="label">發行機構</div>
                <div class="value bank-value">
                    ${escapeHTML(item.Issuer || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">幣別</div>
                <div class="value currency-value">
                    ${escapeHTML(item.Currency || "-")}
                </div>
            </div>


            <div class="cell">
                <div class="label">天期</div>
                <div class="value tenor-value">
                    ${escapeHTML(item.Tenor || "-")}
                    ${item.Tenor ? "M" : ""}
                </div>

                ${solveHint(item, "Tenor")}
            </div>


            <div class="cell">
                <div class="label">年化 Coupon</div>
                <div class="value coupon-value">
                    ${escapeHTML(item.Coupon || "-")}
                </div>

                ${solveHint(item, "Coupon")}
            </div>


            <div class="cell">
                <div class="label">Strike</div>
                <div class="value strike-value">
                    ${escapeHTML(item.Strike || "-")}
                </div>

                ${solveHint(item, "Strike")}
            </div>


            <div class="cell">
                <div class="label">KI</div>
                <div class="value ki-value">
                    ${escapeHTML(item.KI || "-")}
                </div>

                ${solveHint(item, "KI")}
            </div>


            <div class="cell">
                <div class="label">KO</div>
                <div class="value ko-value">
                    ${escapeHTML(item.KO || "-")}
                </div>

                ${solveHint(item, "KO")}
            </div>


            <div class="cell stocks-cell">
                <div class="label">連結標的</div>

                <div class="stocks">
                    ${buildStocks(item)}
                </div>
            </div>
        `;

        list.appendChild(row);
    });

    buildSummary(data);
}

</script>
