<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FCN 每日報價清單</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eef3f8;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    color: #16324a;
}

.app {
    max-width: 1500px;
    margin: auto;
    padding: 24px;
}

/* =========================
   輸入區
========================= */

.control-panel {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 8px 28px rgba(30,55,80,.10);
}

.control-title {
    font-size: 28px;
    font-weight: 900;
    color: #0d3558;
    margin-bottom: 8px;
}

.control-desc {
    color: #647789;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 16px;
}

textarea {
    width: 100%;
    height: 220px;
    border: 2px solid #d6e0e9;
    border-radius: 14px;
    padding: 15px;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    font-family: Consolas, "Microsoft JhengHei", monospace;
}

textarea:focus {
    border-color: #347eb5;
}

.buttons {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 800;
}

.btn-main {
    background: #0d4a79;
    color: white;
}

.btn-secondary {
    background: #e8f0f6;
    color: #19496d;
}

.btn-gold {
    background: #cfa348;
    color: white;
}

/* =========================
   報價畫面
========================= */

#quoteArea {
    background:
        radial-gradient(circle at 90% 8%, rgba(54,150,221,.18), transparent 28%),
        linear-gradient(135deg, #062947, #0c416b 55%, #062947);

    border-radius: 22px;
    padding: 30px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(8,42,72,.20);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;

    padding-bottom: 20px;
    margin-bottom: 18px;

    border-bottom: 1px solid rgba(255,255,255,.18);
}

.brand-small {
    color: #d9ba6c;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 6px;
}

.title {
    color: white;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 8px;
    color: #b0cadc;
    font-size: 15px;
}

.date-box {
    text-align: right;
}

.today {
    color: #f3cf76;
    font-size: 29px;
    font-weight: 900;
}

.update {
    margin-top: 4px;
    color: #9db9cc;
    font-size: 12px;
    letter-spacing: 1px;
}

/* =========================
   摘要
========================= */

.summary {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.summary-card {
    min-width: 135px;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
}

.summary-card span {
    color: #a9c4d7;
    font-size: 12px;
}

.summary-card strong {
    display: block;
    margin-top: 3px;
    font-size: 21px;
    color: #f3cf76;
    font-weight: 900;
}

/* =========================
   商品列
========================= */

.quote-list {
    display: grid;
    gap: 12px;
}

.quote-row {
    display: grid;

    grid-template-columns:
        100px
        80px
        85px
        130px
        115px
        105px
        105px
        1fr;

    align-items: center;
    gap: 10px;

    padding: 18px 18px;

    background: rgba(255,255,255,.98);
    border-radius: 16px;
    border-left: 6px solid #d7aa4d;

    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.cell {
    min-width: 0;
}

.label {
    font-size: 13px;
    font-weight: 700;
    color: #81909e;
    margin-bottom: 5px;
}

.value {
    font-size: 22px;
    font-weight: 900;
    color: #17354f;
    white-space: nowrap;
}

/* =========================
   重點數字
========================= */

.issuer-value {
    font-size: 23px;
    color: #194d74;
}

.currency-value {
    font-size: 23px;
}

.tenor-value {
    font-size: 23px;
}

.coupon-value {
    color: #cb8508;
    font-size: 31px;
    font-weight: 900;
}

.strike-value {
    color: #08785a;
    font-size: 27px;
}

.ki-value {
    color: #985127;
    font-size: 25px;
}

.ko-value {
    color: #176eaa;
    font-size: 25px;
}

/* =========================
   股票標的
========================= */

.stocks {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.stock {
    padding: 8px 12px;
    border-radius: 9px;

    background: #e9f1f8;
    border: 1px solid #d0e0ec;

    color: #163f60;

    font-size: 19px;
    font-weight: 900;
}

/* =========================
   BEST
========================= */

.solve-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 7px;

    border-radius: 5px;

    background: #fff1cf;
    color: #9b6c09;

    font-size: 10px;
    font-weight: 800;
}

/* =========================
   空畫面
========================= */

.empty {
    padding: 60px 20px;
    text-align: center;

    border: 1px dashed rgba(255,255,255,.28);
    border-radius: 15px;

    color: rgba(255,255,255,.68);
}

/* =========================
   Footer
========================= */

.footer-note {
    margin-top: 18px;
    padding-top: 14px;

    border-top: 1px solid rgba(255,255,255,.13);

    color: #99b7ca;
    font-size: 12px;
    line-height: 1.7;
}

/* =========================
   手機
========================= */

@media(max-width: 1050px) {

    .quote-row {
        grid-template-columns: repeat(4, 1fr);
    }

    .stocks-cell {
        grid-column: span 4;
    }
}

@media(max-width: 650px) {

    .app {
        padding: 10px;
    }

    #quoteArea {
        padding: 17px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .date-box {
        text-align: left;
    }

    .title {
        font-size: 28px;
    }

    .quote-row {
        grid-template-columns: repeat(2, 1fr);
    }

    .stocks-cell {
        grid-column: span 2;
    }
}

/* =========================
   列印
========================= */

@media print {

    body {
        background: white;
    }

    .control-panel {
        display: none;
    }

    .app {
        max-width: none;
        padding: 0;
    }

    #quoteArea {
        border-radius: 0;
        box-shadow: none;
        min-height: 100vh;
    }
}

</style>
</head>

<body>

<div class="app">

<div class="control-panel">

    <div class="control-title">
        FCN 每日報價產生器
    </div>

    <div class="control-desc">
        直接從 Excel 或 Outlook 的 FCN 報價表複製後貼上。<br>
        系統會依照 <b>Solve</b> 欄位，自動把 Best 括號內數值填到正確條件。
    </div>

    <textarea
        id="pasteArea"
        placeholder="直接從 Excel 選取 FCN 報價表 → Ctrl+C → 貼在這裡"></textarea>

    <div class="buttons">

        <button
            class="btn-main"
            onclick="generateQuote()">
            生成每日報價
        </button>

        <button
            class="btn-secondary"
            onclick="loadExample()">
            載入範例
        </button>

        <button
            class="btn-secondary"
            onclick="clearAll()">
            清空
        </button>

        <button
            class="btn-gold"
            onclick="window.print()">
            列印 / 存成 PDF
        </button>

    </div>

</div>


<div id="quoteArea">

    <div class="header">

        <div>

            <div class="brand-small">
                STRUCTURED PRODUCTS
            </div>

            <div class="title">
                FCN 每日精選報價
            </div>

            <div class="subtitle">
                精選條件｜快速比較｜掌握每日投資機會
            </div>

        </div>

        <div class="date-box">

            <div
                class="today"
                id="today">
            </div>

            <div class="update">
                DAILY INDICATIVE TERMS
            </div>

        </div>

    </div>


    <div
        class="summary"
        id="summary">
    </div>


    <div
        class="quote-list"
        id="quoteList">

        <div class="empty">
            貼上 FCN 報價資料後<br>
            按「生成每日報價」
        </div>

    </div>


    <div class="footer-note">

        ※ 本資料為每日商品條件整理，僅供內部商品比較與業務溝通使用。<br>
        ※ 實際交易條件、成交價格及相關內容，仍應以交易當時正式報價及相關文件為準。

    </div>

</div>

</div>


<script>

/* =====================================================
   今日日期
===================================================== */

function setToday() {

    const now = new Date();

    const y = now.getFullYear();

    const m = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        now.getDate()
    ).padStart(2, "0");

    document
        .getElementById("today")
        .innerText =
        `${y}.${m}.${d}`;
}

setToday();


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   Best 括號數值

   GS (12.51%)
   → 12.51%
===================================================== */

function extractBestValue(text) {

    if (!text) return "";

    const match =
        String(text)
        .match(/\(([^()]+)\)/);

    return match
        ? match[1].trim()
        : "";
}


/* =====================================================
   發行機構

   GS (12.51%)
   → GS
===================================================== */

function extractIssuer(text) {

    if (!text) return "";

    return String(text)
        .replace(/\(.*?\)/g, "")
        .trim();
}


/* =====================================================
   Header 標準化
===================================================== */

function normalizeHeader(text) {

    let h = String(text || "")
        .replace(/\r/g, "")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

    const map = {

        "best (30 萬)": "Best30",
        "best (30萬)": "Best30",
        "best30萬": "Best30",
        "best 30萬": "Best30",
        "best30": "Best30",

        "best (20 萬)": "Best20",
        "best (20萬)": "Best20",
        "best20萬": "Best20",
        "best 20萬": "Best20",
        "best20": "Best20",

        "solve": "Solve",

        "type": "Type",

        "currency": "Currency",
        "ccy": "Currency",
        "幣別": "Currency",

        "tenor (m)": "Tenor",
        "tenor(m)": "Tenor",
        "tenor": "Tenor",
        "天期": "Tenor",

        "coupon": "Coupon",
        "票息": "Coupon",

        "coupon period": "CouponPeriod",
        "couponperiod": "CouponPeriod",

        "strike": "Strike",

        "ki": "KI",

        "ki freq": "KIFreq",
        "kifreq": "KIFreq",

        "ko": "KO",

        "ko freq": "KOFreq",
        "kofreq": "KOFreq",

        "ko start": "KOStart",
        "kostart": "KOStart",

        "memory ko": "MemoryKO",
        "memoryko": "MemoryKO",

        "u1": "U1",
        "u2": "U2",
        "u3": "U3",
        "u4": "U4"
    };

    return map[h] || text.trim();
}


/* =====================================================
   Solve 標準化
===================================================== */

function normalizeSolve(text) {

    if (!text) return "";

    let s = String(text)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/_/g, "")
        .replace(/-/g, "");

    const map = {

        "coupon": "Coupon",
        "票息": "Coupon",

        "strike": "Strike",
        "履約價": "Strike",

        "ki": "KI",

        "kifreq": "KIFreq",

        "ko": "KO",

        "kofreq": "KOFreq",

        "kostart": "KOStart",

        "tenor": "Tenor",
        "tenorm": "Tenor",

        "couponperiod": "CouponPeriod",

        "memoryko": "MemoryKO",

        "memory": "MemoryKO"
    };

    return map[s] || "";
}


/* =====================================================
   判斷 Header
===================================================== */

function looksLikeHeader(row) {

    const text =
        row
        .join(" ")
        .toLowerCase();

    const keywords = [
        "best",
        "solve",
        "type",
        "currency",
        "tenor",
        "coupon",
        "strike",
        "ki",
        "ko",
        "u1"
    ];

    let count = 0;

    keywords.forEach(k => {

        if (
            text.includes(k)
        ) {
            count++;
        }

    });

    return count >= 4;
}


/* =====================================================
   切割 Excel / Outlook 列
===================================================== */

function splitRow(line) {

    if (
        line.includes("\t")
    ) {

        return line
            .split("\t")
            .map(v =>
                String(v)
                    .replace(/\r/g, "")
                    .replace(/\n/g, " ")
                    .replace(/\u00A0/g, " ")
                    .trim()
            );
    }

    return line
        .trim()
        .split(/\s{2,}/)
        .map(v =>
            String(v)
                .replace(/\r/g, "")
                .replace(/\n/g, " ")
                .replace(/\u00A0/g, " ")
                .trim()
        );
}


/* =====================================================
   判斷是不是 FCN 商品列
===================================================== */

function looksLikeFCNRow(row) {

    const text =
        row
        .join(" ")
        .toUpperCase();

    return (
        text.includes("FCN") ||
        text.includes("USD") ||
        text.includes("JPY") ||
        text.includes("TSM") ||
        text.includes("NVDA") ||
        text.includes("GOOGL") ||
        text.includes("AAPL")
    );
}


/* =====================================================
   解析資料
===================================================== */

function parseData(text) {

    let rawLines = String(text)
        .replace(/\u00A0/g, " ")
        .split(/\r?\n/)
        .map(line => line.trimEnd())
        .filter(line => line.trim() !== "");

    if (!rawLines.length) {
        return [];
    }

    let rows =
        rawLines.map(splitRow);


    /* =========================
       找 Header
    ========================= */

    let headerIndex =
        rows.findIndex(row =>
            looksLikeHeader(row)
        );


    let headers;


    if (
        headerIndex >= 0
    ) {

        headers =
            rows[headerIndex]
            .map(normalizeHeader);

        rows =
            rows.slice(
                headerIndex + 1
            );

    } else {

        headers = [

            "Best30",
            "Best20",
            "Solve",
            "Type",
            "Currency",
            "Tenor",
            "Coupon",
            "CouponPeriod",
            "Strike",
            "KI",
            "KIFreq",
            "KO",
            "KOFreq",
            "KOStart",
            "MemoryKO",
            "U1",
            "U2",
            "U3",
            "U4"

        ];
    }


    /* =========================
       只保留商品列
    ========================= */

    rows =
        rows.filter(row =>
            looksLikeFCNRow(row)
        );


    /* =========================
       轉成物件
    ========================= */

    const data =
        rows.map(row => {

            let obj = {};

            headers.forEach(
                (header, index) => {

                    obj[header] =
                        row[index] !== undefined
                        ? row[index]
                        : "";

                }
            );


            /* =====================
               Best
            ===================== */

            const bestText =
                obj.Best30 ||
                obj.Best20 ||
                "";

            obj.Issuer =
                extractIssuer(
                    bestText
                );

            obj.BestValue =
                extractBestValue(
                    bestText
                );


            /* =====================
               Solve
            ===================== */

            const solveField =
                normalizeSolve(
                    obj.Solve
                );

            obj.SolveField =
                solveField;


            /* =====================
               把 Best 填入 Solve 欄
            ===================== */

            if (
                solveField &&
                obj.BestValue
            ) {

                const oldValue =
                    String(
                        obj[solveField] || ""
                    ).trim();

                if (
                    oldValue === "" ||
                    oldValue.toUpperCase() === "NA"
                ) {

                    obj[solveField] =
                        obj.BestValue;
                }
            }


            return obj;

        });


    return data;
}


/* =====================================================
   股票標的
===================================================== */

function buildStocks(item) {

    const stocks = [

        item.U1,
        item.U2,
        item.U3,
        item.U4

    ].filter(v => {

        if (!v) return false;

        const x =
            String(v)
            .trim()
            .toUpperCase();

        return (
            x !== "" &&
            x !== "NA" &&
            x !== "-"
        );

    });


    if (!stocks.length) {

        return `
            <span class="stock">
                -
            </span>
        `;
    }


    return stocks
        .map(stock => `

            <span class="stock">
                ${escapeHTML(stock)}
            </span>

        `)
        .join("");
}


/* =====================================================
   BEST 標籤
===================================================== */

function solveHint(item, field) {

    if (
        item.SolveField === field
    ) {

        return `
            <div class="solve-tag">
                BEST
            </div>
        `;
    }

    return "";
}


/* =====================================================
   生成畫面
===================================================== */

function generateQuote() {

    const text =
        document
        .getElementById(
            "pasteArea"
        )
        .value;

    if (!text.trim()) {

        alert(
            "請先貼上 FCN 報價資料"
        );

        return;
    }


    const data =
        parseData(text);


    if (!data.length) {

        alert(
            "沒有讀取到有效的 FCN 報價資料"
        );

        return;
    }


    const list =
        document
        .getElementById(
            "quoteList"
        );

    list.innerHTML = "";


    data.forEach(item => {

        const row =
            document
            .createElement(
                "div"
            );

        row.className =
            "quote-row";


        row.innerHTML = `


            <!-- 發行機構 -->

            <div class="cell">

                <div class="label">
                    發行機構
                </div>

                <div class="
                    value
                    issuer-value
                ">

                    ${escapeHTML(
                        item.Issuer || "-"
                    )}

                </div>

            </div>


            <!-- 幣別 -->

            <div class="cell">

                <div class="label">
                    幣別
                </div>

                <div class="
                    value
                    currency-value
                ">

                    ${escapeHTML(
                        item.Currency || "-"
                    )}

                </div>

            </div>


            <!-- 天期 -->

            <div class="cell">

                <div class="label">
                    天期
                </div>

                <div class="
                    value
                    tenor-value
                ">

                    ${escapeHTML(
                        item.Tenor || "-"
                    )}

                    ${item.Tenor ? "M" : ""}

                </div>

                ${solveHint(
                    item,
                    "Tenor"
                )}

            </div>


            <!-- Coupon -->

            <div class="cell">

                <div class="label">
                    年化 Coupon
                </div>

                <div class="
                    value
                    coupon-value
                ">

                    ${escapeHTML(
                        item.Coupon || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "Coupon"
                )}

            </div>


            <!-- Strike -->

            <div class="cell">

                <div class="label">
                    Strike
                </div>

                <div class="
                    value
                    strike-value
                ">

                    ${escapeHTML(
                        item.Strike || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "Strike"
                )}

            </div>


            <!-- KI -->

            <div class="cell">

                <div class="label">
                    KI
                </div>

                <div class="
                    value
                    ki-value
                ">

                    ${escapeHTML(
                        item.KI || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "KI"
                )}

            </div>


            <!-- KO -->

            <div class="cell">

                <div class="label">
                    KO
                </div>

                <div class="
                    value
                    ko-value
                ">

                    ${escapeHTML(
                        item.KO || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "KO"
                )}

            </div>


            <!-- 標的 -->

            <div class="
                cell
                stocks-cell
            ">

                <div class="label">
                    連結標的
                </div>

                <div class="stocks">
                    ${buildStocks(item)}
                </div>

            </div>

        `;


        list.appendChild(
            row
        );

    });


    buildSummary(data);
}


/* =====================================================
   摘要
===================================================== */

function buildSummary(data) {

    const summary =
        document
        .getElementById(
            "summary"
        );


    const currencies = [

        ...new Set(

            data
            .map(x =>
                x.Currency
            )
            .filter(Boolean)

        )

    ];


    const tenors = [

        ...new Set(

            data
            .map(x =>
                x.Tenor
            )
            .filter(Boolean)

        )

    ];


    const coupons =
        data
        .map(x => {

            return parseFloat(

                String(
                    x.Coupon || ""
                )
                .replace(
                    /%/g,
                    ""
                )

            );

        })
        .filter(x =>
            !isNaN(x)
        );


    const maxCoupon =
        coupons.length

        ? Math.max(
            ...coupons
        ).toFixed(2) + "%"

        : "-";


    summary.innerHTML = `

        <div class="summary-card">

            <span>
                今日精選
            </span>

            <strong>
                ${data.length} 組
            </strong>

        </div>


        <div class="summary-card">

            <span>
                幣別
            </span>

            <strong>
                ${
                    currencies.join(" / ")
                    ||
                    "-"
                }
            </strong>

        </div>


        <div class="summary-card">

            <span>
                天期
            </span>

            <strong>
                ${
                    tenors
                    .map(x =>
                        x + "M"
                    )
                    .join(" / ")
                    ||
                    "-"
                }
            </strong>

        </div>


        <div class="summary-card">

            <span>
                最高 Coupon
            </span>

            <strong>
                ${maxCoupon}
            </strong>

        </div>

    `;
}
