<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FCN 每日報價清單</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eef3f8;
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    color: #16324a;
}

.app {
    max-width: 1500px;
    margin: auto;
    padding: 24px;
}

/* =========================
   輸入區
========================= */

.control-panel {
    background: white;
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 8px 28px rgba(30,55,80,.10);
}

.control-title {
    font-size: 28px;
    font-weight: 900;
    color: #0d3558;
    margin-bottom: 8px;
}

.control-desc {
    color: #647789;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 16px;
}

textarea {
    width: 100%;
    height: 220px;
    border: 2px solid #d6e0e9;
    border-radius: 14px;
    padding: 15px;
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
    font-family: Consolas, "Microsoft JhengHei", monospace;
}

textarea:focus {
    border-color: #347eb5;
}

.buttons {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 800;
}

.btn-main {
    background: #0d4a79;
    color: white;
}

.btn-secondary {
    background: #e8f0f6;
    color: #19496d;
}

.btn-gold {
    background: #cfa348;
    color: white;
}

/* =========================
   報價畫面
========================= */

#quoteArea {
    background:
        radial-gradient(circle at 90% 8%, rgba(54,150,221,.18), transparent 28%),
        linear-gradient(135deg, #062947, #0c416b 55%, #062947);

    border-radius: 22px;
    padding: 30px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(8,42,72,.20);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;

    padding-bottom: 20px;
    margin-bottom: 18px;

    border-bottom: 1px solid rgba(255,255,255,.18);
}

.brand-small {
    color: #d9ba6c;
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 6px;
}

.title {
    color: white;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 8px;
    color: #b0cadc;
    font-size: 15px;
}

.date-box {
    text-align: right;
}

.today {
    color: #f3cf76;
    font-size: 29px;
    font-weight: 900;
}

.update {
    margin-top: 4px;
    color: #9db9cc;
    font-size: 12px;
    letter-spacing: 1px;
}

/* =========================
   摘要
========================= */

.summary {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.summary-card {
    min-width: 135px;
    padding: 10px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
}

.summary-card span {
    color: #a9c4d7;
    font-size: 12px;
}

.summary-card strong {
    display: block;
    margin-top: 3px;
    font-size: 21px;
    color: #f3cf76;
    font-weight: 900;
}

/* =========================
   商品列
========================= */

.quote-list {
    display: grid;
    gap: 12px;
}

.quote-row {
    display: grid;

    grid-template-columns:
        105px
        80px
        85px
        135px
        115px
        105px
        105px
        1fr;

    align-items: center;
    gap: 10px;

    padding: 18px;

    background: rgba(255,255,255,.98);
    border-radius: 16px;
    border-left: 6px solid #d7aa4d;

    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.cell {
    min-width: 0;
}

.label {
    font-size: 13px;
    font-weight: 700;
    color: #81909e;
    margin-bottom: 5px;
}

.value {
    font-size: 22px;
    font-weight: 900;
    color: #17354f;
    white-space: nowrap;
}

/* =========================
   重點數字
========================= */

.issuer-value {
    font-size: 24px;
    color: #194d74;
}

.currency-value {
    font-size: 23px;
}

.tenor-value {
    font-size: 23px;
}

.coupon-value {
    color: #cb8508;
    font-size: 32px;
    font-weight: 900;
}

.strike-value {
    color: #08785a;
    font-size: 28px;
}

.ki-value {
    color: #985127;
    font-size: 26px;
}

.ko-value {
    color: #176eaa;
    font-size: 26px;
}

/* =========================
   股票標的
========================= */

.stocks {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.stock {
    padding: 8px 12px;
    border-radius: 9px;

    background: #e9f1f8;
    border: 1px solid #d0e0ec;

    color: #163f60;

    font-size: 19px;
    font-weight: 900;
}

/* =========================
   BEST 標示
========================= */

.solve-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 7px;

    border-radius: 5px;

    background: #fff1cf;
    color: #9b6c09;

    font-size: 10px;
    font-weight: 800;
}

/* =========================
   空畫面
========================= */

.empty {
    padding: 60px 20px;
    text-align: center;

    border: 1px dashed rgba(255,255,255,.28);
    border-radius: 15px;

    color: rgba(255,255,255,.68);
}

/* =========================
   Footer
========================= */

.footer-note {
    margin-top: 18px;
    padding-top: 14px;

    border-top: 1px solid rgba(255,255,255,.13);

    color: #99b7ca;
    font-size: 12px;
    line-height: 1.7;
}

/* =========================
   手機
========================= */

@media(max-width: 1050px) {

    .quote-row {
        grid-template-columns: repeat(4, 1fr);
    }

    .stocks-cell {
        grid-column: span 4;
    }
}

@media(max-width: 650px) {

    .app {
        padding: 10px;
    }

    #quoteArea {
        padding: 17px;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .date-box {
        text-align: left;
    }

    .title {
        font-size: 28px;
    }

    .quote-row {
        grid-template-columns: repeat(2, 1fr);
    }

    .stocks-cell {
        grid-column: span 2;
    }
}

/* =========================
   列印
========================= */

@media print {

    body {
        background: white;
    }

    .control-panel {
        display: none;
    }

    .app {
        max-width: none;
        padding: 0;
    }

    #quoteArea {
        border-radius: 0;
        box-shadow: none;
        min-height: 100vh;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="control-panel">

        <div class="control-title">
            FCN 每日報價產生器
        </div>

        <div class="control-desc">
            直接從原始 FCN Excel 報價表複製後貼上。<br>
            例如 <b>GS (12.51%)</b>：
            GS 會辨識為「發行機構」，12.51% 會依照 Solve 自動補回正確欄位。
        </div>

        <textarea
            id="pasteArea"
            placeholder="直接從 Excel 複製 FCN 報價資料，再貼到這裡"></textarea>

        <div class="buttons">

            <button
                class="btn-main"
                onclick="generateQuote()">
                生成每日報價
            </button>

            <button
                class="btn-secondary"
                onclick="loadExample()">
                載入範例
            </button>

            <button
                class="btn-secondary"
                onclick="clearAll()">
                清空
            </button>

            <button
                class="btn-gold"
                onclick="window.print()">
                列印 / 存成 PDF
            </button>

        </div>

    </div>


    <div id="quoteArea">

        <div class="header">

            <div>

                <div class="brand-small">
                    STRUCTURED PRODUCTS
                </div>

                <div class="title">
                    FCN 每日精選報價
                </div>

                <div class="subtitle">
                    精選條件｜快速比較｜掌握每日投資機會
                </div>

            </div>

            <div class="date-box">

                <div
                    class="today"
                    id="today">
                </div>

                <div class="update">
                    DAILY INDICATIVE TERMS
                </div>

            </div>

        </div>


        <div
            class="summary"
            id="summary">
        </div>


        <div
            class="quote-list"
            id="quoteList">

            <div class="empty">
                貼上 FCN 報價資料後<br>
                按「生成每日報價」
            </div>

        </div>


        <div class="footer-note">

            ※ 本資料為每日商品條件整理，僅供內部商品比較與業務溝通使用。<br>
            ※ 實際交易條件、成交價格及相關內容，仍應以交易當時正式報價及相關文件為準。

        </div>

    </div>

</div>


<script>

/* =====================================================
   今日日期
===================================================== */

function setToday() {

    const now = new Date();

    const y = now.getFullYear();

    const m = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        now.getDate()
    ).padStart(2, "0");

    document
        .getElementById("today")
        .innerText =
        `${y}.${m}.${d}`;
}

setToday();


/* =====================================================
   HTML 安全
===================================================== */

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   從 Best 抓括號中的數值

   GS (12.51%)
   → 12.51%
===================================================== */

function extractBestValue(text) {

    if (!text) {
        return "";
    }

    const match =
        String(text)
        .match(/\(([^()]+)\)/);

    if (!match) {
        return "";
    }

    return match[1].trim();
}


/* =====================================================
   從 Best 抓發行機構

   GS (12.51%)
   → GS
===================================================== */

function extractIssuer(text) {

    if (!text) {
        return "";
    }

    return String(text)
        .replace(/\([^()]*\)/g, "")
        .trim();
}


/* =====================================================
   Header 標準化
===================================================== */

function normalizeHeader(text) {

    const h = String(text || "")
        .replace(/\r/g, "")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();

    const map = {

        "best (30 萬)": "Best30",
        "best (30萬)": "Best30",
        "best 30萬": "Best30",
        "best30萬": "Best30",
        "best30": "Best30",

        "best (20 萬)": "Best20",
        "best (20萬)": "Best20",
        "best 20萬": "Best20",
        "best20萬": "Best20",
        "best20": "Best20",

        "solve": "Solve",

        "type": "Type",

        "currency": "Currency",
        "ccy": "Currency",
        "幣別": "Currency",

        "tenor (m)": "Tenor",
        "tenor(m)": "Tenor",
        "tenor": "Tenor",
        "天期": "Tenor",

        "coupon": "Coupon",
        "票息": "Coupon",

        "coupon period": "CouponPeriod",
        "couponperiod": "CouponPeriod",

        "strike": "Strike",

        "ki": "KI",

        "ki freq": "KIFreq",
        "kifreq": "KIFreq",

        "ko": "KO",

        "ko freq": "KOFreq",
        "kofreq": "KOFreq",

        "ko start": "KOStart",
        "kostart": "KOStart",

        "memory ko": "MemoryKO",
        "memoryko": "MemoryKO",

        "u1": "U1",
        "u2": "U2",
        "u3": "U3",
        "u4": "U4"
    };

    return map[h] || text.trim();
}


/* =====================================================
   Solve 標準化

   Solve = Coupon → 補 Coupon
   Solve = Strike → 補 Strike
   Solve = KI → 補 KI
   Solve = KO → 補 KO
===================================================== */

function normalizeSolve(text) {

    if (!text) {
        return "";
    }

    const s = String(text)
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/_/g, "")
        .replace(/-/g, "");

    const map = {

        "coupon": "Coupon",
        "票息": "Coupon",

        "strike": "Strike",
        "履約價": "Strike",

        "ki": "KI",

        "kifreq": "KIFreq",

        "ko": "KO",

        "kofreq": "KOFreq",

        "kostart": "KOStart",

        "tenor": "Tenor",
        "tenorm": "Tenor",

        "couponperiod": "CouponPeriod",

        "memoryko": "MemoryKO",
        "memory": "MemoryKO"
    };

    return map[s] || "";
}


/* =====================================================
   判斷是否 Header
===================================================== */

function looksLikeHeader(row) {

    const text =
        row
        .join(" ")
        .toLowerCase();

    const keywords = [
        "best",
        "solve",
        "type",
        "currency",
        "tenor",
        "coupon",
        "strike",
        "ki",
        "ko",
        "u1"
    ];

    let count = 0;

    keywords.forEach(keyword => {

        if (
            text.includes(keyword)
        ) {
            count++;
        }

    });

    return count >= 4;
}


/* =====================================================
   切割 Excel 資料

   最重要：
   TAB 空白欄不能刪掉
   否則資料會整個往左位移
===================================================== */

function splitRow(line) {

    if (
        line.includes("\t")
    ) {

        return line
            .split("\t")
            .map(value => {

                return String(value)
                    .replace(/\r/g, "")
                    .replace(/\n/g, " ")
                    .replace(/\u00A0/g, " ")
                    .trim();

            });
    }

    /*
       沒有 TAB 才使用連續空格切割
    */

    return line
        .trim()
        .split(/\s{2,}/)
        .map(value => {

            return String(value)
                .replace(/\r/g, "")
                .replace(/\n/g, " ")
                .replace(/\u00A0/g, " ")
                .trim();

        });
}


/* =====================================================
   商品列判定
===================================================== */

function looksLikeProductRow(row) {

    const text =
        row
        .join(" ")
        .toUpperCase();

    if (
        text.includes("FCN")
    ) {
        return true;
    }

    if (
        text.includes("USD") ||
        text.includes("JPY")
    ) {
        return true;
    }

    return false;
}


/* =====================================================
   解析貼上資料
===================================================== */

function parseData(text) {

    let rawLines =
        String(text)
        .replace(/\u00A0/g, " ")
        .split(/\r?\n/)
        .filter(line =>
            line.trim() !== ""
        );


    if (!rawLines.length) {
        return [];
    }


    let rows =
        rawLines.map(splitRow);


    /* =========================
       找 Header
    ========================= */

    const headerIndex =
        rows.findIndex(row =>
            looksLikeHeader(row)
        );


    let headers;


    if (
        headerIndex >= 0
    ) {

        headers =
            rows[headerIndex]
            .map(normalizeHeader);

        rows =
            rows.slice(
                headerIndex + 1
            );

    } else {

        /*
           沒有標題列時使用預設順序
        */

        headers = [

            "Best30",
            "Best20",
            "Solve",
            "Type",
            "Currency",
            "Tenor",
            "Coupon",
            "CouponPeriod",
            "Strike",
            "KI",
            "KIFreq",
            "KO",
            "KOFreq",
            "KOStart",
            "MemoryKO",
            "U1",
            "U2",
            "U3",
            "U4"

        ];
    }


    /* =========================
       過濾非商品列
    ========================= */

    rows =
        rows.filter(row =>
            looksLikeProductRow(row)
        );


    /* =========================
       每列轉成 Object
    ========================= */

    return rows.map(row => {


        let obj = {};


        headers.forEach(
            (header, index) => {

                obj[header] =
                    row[index] !== undefined
                    ? row[index]
                    : "";

            }
        );


        /* =========================
           Best 優先順序

           先用 Best30
           沒有才用 Best20
        ========================= */

        let bestText =
            String(
                obj.Best30 || ""
            ).trim();


        if (!bestText) {

            bestText =
                String(
                    obj.Best20 || ""
                ).trim();

        }


        /* =========================
           GS (12.51%)

           GS
           → 發行機構

           12.51%
           → Solve 對應欄位數值
        ========================= */

        obj.Issuer =
            extractIssuer(
                bestText
            );


        obj.BestValue =
            extractBestValue(
                bestText
            );


        /* =========================
           取得 Solve 欄位
        ========================= */

        const solveField =
            normalizeSolve(
                obj.Solve
            );


        obj.SolveField =
            solveField;


        /* =========================
           核心邏輯

           不猜哪個欄位空白。

           直接看 Solve：

           Solve = Coupon
           → BestValue 填 Coupon

           Solve = Strike
           → BestValue 填 Strike

           Solve = KI
           → BestValue 填 KI

           Solve = KO
           → BestValue 填 KO
        ========================= */

        if (
            solveField &&
            obj.BestValue
        ) {

            obj[solveField] =
                obj.BestValue;

        }


        return obj;

    });

}


/* =====================================================
   股票標的
===================================================== */

function buildStocks(item) {

    const stocks = [

        item.U1,
        item.U2,
        item.U3,
        item.U4

    ].filter(value => {

        if (!value) {
            return false;
        }

        const text =
            String(value)
            .trim()
            .toUpperCase();

        return (
            text !== "" &&
            text !== "NA" &&
            text !== "-"
        );

    });


    if (!stocks.length) {

        return `
            <span class="stock">
                -
            </span>
        `;
    }


    return stocks
        .map(stock => `

            <span class="stock">
                ${escapeHTML(stock)}
            </span>

        `)
        .join("");

}


/* =====================================================
   哪一個欄位是 BEST 報價
===================================================== */

function solveHint(item, field) {

    if (
        item.SolveField === field
    ) {

        return `
            <div class="solve-tag">
                BEST
            </div>
        `;
    }

    return "";
}


/* =====================================================
   生成報價畫面
===================================================== */

function generateQuote() {

    const text =
        document
        .getElementById(
            "pasteArea"
        )
        .value;


    if (
        !text.trim()
    ) {

        alert(
            "請先貼上 FCN 報價資料"
        );

        return;
    }


    const data =
        parseData(text);


    if (
        !data.length
    ) {

        alert(
            "沒有讀取到有效的 FCN 報價資料"
        );

        return;
    }


    const list =
        document
        .getElementById(
            "quoteList"
        );


    list.innerHTML = "";


    data.forEach(item => {


        const row =
            document
            .createElement(
                "div"
            );


        row.className =
            "quote-row";


        row.innerHTML = `


            <!-- 發行機構 -->

            <div class="cell">

                <div class="label">
                    發行機構
                </div>

                <div class="
                    value
                    issuer-value
                ">

                    ${escapeHTML(
                        item.Issuer || "-"
                    )}

                </div>

            </div>


            <!-- 幣別 -->

            <div class="cell">

                <div class="label">
                    幣別
                </div>

                <div class="
                    value
                    currency-value
                ">

                    ${escapeHTML(
                        item.Currency || "-"
                    )}

                </div>

            </div>


            <!-- 天期 -->

            <div class="cell">

                <div class="label">
                    天期
                </div>

                <div class="
                    value
                    tenor-value
                ">

                    ${escapeHTML(
                        item.Tenor || "-"
                    )}

                    ${item.Tenor ? "M" : ""}

                </div>

                ${solveHint(
                    item,
                    "Tenor"
                )}

            </div>


            <!-- Coupon -->

            <div class="cell">

                <div class="label">
                    年化 Coupon
                </div>

                <div class="
                    value
                    coupon-value
                ">

                    ${escapeHTML(
                        item.Coupon || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "Coupon"
                )}

            </div>


            <!-- Strike -->

            <div class="cell">

                <div class="label">
                    Strike
                </div>

                <div class="
                    value
                    strike-value
                ">

                    ${escapeHTML(
                        item.Strike || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "Strike"
                )}

            </div>


            <!-- KI -->

            <div class="cell">

                <div class="label">
                    KI
                </div>

                <div class="
                    value
                    ki-value
                ">

                    ${escapeHTML(
                        item.KI || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "KI"
                )}

            </div>


            <!-- KO -->

            <div class="cell">

                <div class="label">
                    KO
                </div>

                <div class="
                    value
                    ko-value
                ">

                    ${escapeHTML(
                        item.KO || "-"
                    )}

                </div>

                ${solveHint(
                    item,
                    "KO"
                )}

            </div>


            <!-- 連結標的 -->

            <div class="
                cell
                stocks-cell
            ">

                <div class="label">
                    連結標的
                </div>

                <div class="stocks">
                    ${buildStocks(item)}
                </div>

            </div>

        `;


        list.appendChild(
            row
        );

    });


    buildSummary(data);

}


/* =====================================================
   上方統計
===================================================== */

function buildSummary(data) {

    const summary =
        document
        .getElementById(
            "summary"
        );


    const currencies = [

        ...new Set(

            data
            .map(item =>
                item.Currency
            )
            .filter(Boolean)

        )

    ];


    const tenors = [

        ...new Set(

            data
            .map(item =>
                item.Tenor
            )
            .filter(Boolean)

        )

    ];


    const coupons =
        data
        .map(item => {

            return parseFloat(

                String(
                    item.Coupon || ""
                )
                .replace(
                    /%/g,
                    ""
                )

            );

        })
        .filter(value =>
            !isNaN(value)
        );


    const maxCoupon =
        coupons.length

        ? Math.max(
            ...coupons
        ).toFixed(2) + "%"

        : "-";


    summary.innerHTML = `


        <div class="summary-card">

            <span>
                今日精選
            </span>

            <strong>
                ${data.length} 組
            </strong>

        </div>


        <div class="summary-card">

            <span>
                幣別
            </span>

            <strong>

                ${
                    currencies.join(" / ")
                    ||
                    "-"
                }

            </strong>

        </div>


        <div class="summary-card">

            <span>
                天期
            </span>

            <strong>

                ${
                    tenors
                    .map(value =>
                        value + "M"
                    )
                    .join(" / ")
                    ||
                    "-"
                }

            </strong>

        </div>


        <div class="summary-card">

            <span>
                最高 Coupon
            </span>

            <strong>
                ${maxCoupon}
            </strong>

        </div>

    `;

}
