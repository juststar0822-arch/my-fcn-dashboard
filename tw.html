<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外債券動態工具</title>
    <!-- 引入 SheetJS 解析 Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- 引入 html2canvas 支援一鍵截圖儲存圖片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif; background-color: #f1f5f9; color: #1e293b; padding: 24px; }
        .container { max-width: 1700px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 12px; box-shadow: 0 10px 25px -3px rgba(0,0,0,0.05); }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px; background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
        @media (max-width: 900px) { .control-panel { grid-template-columns: 1fr; } }
        .card h3 { font-size: 16px; color: #0f172a; margin-bottom: 6px; }
        .card p { font-size: 12px; color: #64748b; margin-bottom: 12px; }
        .upload-btn { background-color: #2563eb; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-block; }
        .upload-btn:hover { background-color: #1d4ed8; }
        input[type="file"] { display: none; }
        textarea { width: 100%; height: 95px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; font-size: 13px; resize: vertical; background: #fff; }
        .btn-group { display: flex; gap: 12px; margin-top: 12px; }
        .action-btn { background-color: #059669; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; }
        .action-btn:hover { background-color: #047857; }
        .download-img-btn { background-color: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; display: none; }
        .download-img-btn:hover { background-color: #6d28d9; }
        
        #captureArea { background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 3px solid #0f172a; padding-bottom: 14px; }
        .header-bar h1 { font-size: 20px; color: #0f172a; font-weight: 800; }
        .date-badge { font-size: 14px; font-weight: bold; color: #334155; background: #e2e8f0; padding: 6px 14px; border-radius: 6px; }
        
        .table-section { margin-bottom: 35px; }
        .section-title { background: #d9e1f2; color: #000000; font-size: 15px; font-weight: bold; padding: 10px 16px; border: 1px solid #b0c4de; border-bottom: none; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: #ffffff; margin-bottom: 10px; }
        th, td { border: 1px solid #bfbfbf; padding: 8px 10px; text-align: center; vertical-align: middle; }
        th { background-color: #333333; color: #ffffff; font-weight: bold; font-size: 12px; }
        td.text-left { text-align: left; }
        td.text-right { text-align: right; }
        td.highlight-orange { background-color: #fce4d6 !important; font-weight: bold; color: #000000; }
        tr:nth-child(even) { background-color: #fafafa; }
        tr:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <div class="card">
            <h3>📊 上傳每日報價檔案</h3>
            <p>支援多工作表 (.xlsx, .xls)</p>
            <label class="upload-btn">
                選擇 Excel 檔案
                <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleFile(event)">
            </label>
            <div id="fileStatus" style="margin-top: 10px; font-size: 13px; color: #059669; font-weight: bold;"></div>
        </div>

        <div class="card">
            <h3>🔍 輸入欲查詢的 ISIN 代碼 (必須相符才會帶入)</h3>
            <p>每行輸入一個代碼，或用逗號隔開</p>
            <textarea id="isinInput" placeholder="例如：
US91324PAR38
US12189TAZ75"></textarea>
            <div class="btn-group">
                <button class="action-btn" onclick="filterAndRender()">依 ISIN 精準篩選帶入</button>
                <button class="download-img-btn" id="downloadImgBtn" onclick="downloadImage()">📸 儲存為精美圖片</button>
            </div>
        </div>
    </div>

    <div id="captureArea">
        <div class="header-bar">
            <h1>海外債券每日報價</h1>
            <div class="date-badge" id="reportDate">報價日期：載入中...</div>
        </div>

        <div id="resultContainer">
            <div style="text-align: center; color: #94a3b8; padding: 50px; font-size: 14px;">
                請先上傳檔案並輸入欲查詢的 ISIN 代碼。
            </div>
        </div>
    </div>
</div>

<script>
    let globalWorkbook = null;
    let extractedRows = [];
    let detectedHeaders = [];

    const today = new Date().toISOString().slice(0, 10).replace(/-/g, '/');
    document.getElementById('reportDate').innerText = `報價日期：${today}`;

    function handleFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                globalWorkbook = XLSX.read(data, { type: 'array' });
                
                extractedRows = [];
                let uniqueIsinSet = new Set();

                globalWorkbook.SheetNames.forEach(sheetName => {
                    const ws = globalWorkbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    
                    let headerIndex = -1;
                    let headers = [];

                    for (let i = 0; i < rows.length; i++) {
                        let rStr = rows[i].join(" ");
                        if (rStr.includes("ISIN") || rStr.includes("發行機構")) {
                            headerIndex = i;
                            headers = rows[i];
                            if (detectedHeaders.length === 0) {
                                detectedHeaders = headers;
                            }
                            break;
                        }
                    }

                    if (headerIndex !== -1) {
                        for (let i = headerIndex + 1; i < rows.length; i++) {
                            let row = rows[i];
                            let rowStr = row.join(" ");
                            if (row.length >= 2 && row[0] && String(row[0]).trim().length >= 8 && !rowStr.includes("ISIN")) {
                                let isin = String(row[0]).trim().toUpperCase();
                                if (!uniqueIsinSet.has(isin)) {
                                    uniqueIsinSet.add(isin);
                                    extractedRows.push({
                                        sheet: sheetName,
                                        headers: headers,
                                        data: row
                                    });
                                }
                            }
                        }
                    }
                });

                document.getElementById('fileStatus').innerText = `✅ 成功載入檔案！共讀取 ${extractedRows.length} 筆不重複債券資料，請於右側輸入 ISIN 查詢。`;
            } catch (err) {
                alert("解析檔案發生錯誤：" + err);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function formatNumber(val, decimals) {
        if (val === undefined || val === null || val === '') return '';
        let num = Number(val);
        if (!isNaN(num)) {
            return num.toFixed(decimals);
        }
        return val;
    }

    function formatPercentage(val) {
        if (val === undefined || val === null || val === '') return '';
        let strVal = String(val).trim();
        if (strVal.includes('%')) return strVal;
        let num = Number(val);
        if (!isNaN(num)) {
            let percentage = num < 1 ? num * 100 : num;
            return percentage.toFixed(2) + '%';
        }
        return val;
    }

    function getColVal(headers, row, keywordList) {
        for (let kw of keywordList) {
            for (let idx = 0; idx < headers.length; idx++) {
                let hText = String(headers[idx] || "").trim();
                if (hText.includes(kw)) {
                    return row[idx] !== undefined ? row[idx] : "";
                }
            }
        }
        return "";
    }

    function filterAndRender() {
        if (extractedRows.length === 0) {
            alert("請先上傳 Excel 檔案！");
            return;
        }

        const rawIsinText = document.getElementById('isinInput').value.trim();
        if (rawIsinText === "") {
            alert("請輸入至少一個 ISIN 代碼才能進行篩選帶入！");
            return;
        }

        let targetIsins = rawIsinText.split(/[\n,]+/).map(s => s.trim().toUpperCase()).filter(s => s.length > 0);

        const container = document.getElementById('resultContainer');
        container.innerHTML = '';

        let matchedItems = [];
        extractedRows.forEach(item => {
            let currentIsin = String(item.data[0]).trim().toUpperCase();
            if (targetIsins.includes(currentIsin)) {
                matchedItems.push(item);
            }
        });

        if (matchedItems.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#e11d48; padding:40px; font-weight:bold;">找不到任何符合您輸入的 ISIN 代碼資料，請確認代碼是否正確。</p>`;
            document.getElementById('downloadImgBtn').style.display = 'none';
            return;
        }

        const targetHeaders = [
            "ISIN代碼", "發行機構", "幣別", "票面利率", "類型", 
            "配息頻率", "債償順位", "債券信評", "買進參考價", 
            "到期收益率", "到期年限", "每萬元前手息", "申購資格"
        ];

        let htmlContent = `
            <div class="table-section">
                <div class="section-title">海外債券查詢結果清單</div>
                <table>
                    <thead>
                        <tr>
        `;
        targetHeaders.forEach(h => { htmlContent += `<th>${h}</th>`; });
        htmlContent += `</tr></thead><tbody>`;

        matchedItems.forEach(item => {
            htmlContent += `<tr>`;
            
            let h = item.headers;
            let r = item.data;

            let isin = r[0] || '';
            let issuer = getColVal(h, r, ["發行機構", "保證機構", "證券名稱"]);
            let currency = getColVal(h, r, ["幣別", "幣種"]) || "USD";
            let coupon = formatPercentage(getColVal(h, r, ["票面利率", "債息", "利率"]));
            let bondType = getColVal(h, r, ["類型"]);
            let freq = getColVal(h, r, ["配息頻率"]);
            let seniority = getColVal(h, r, ["債償順位", "債信順位", "順位"]);
            let rating = getColVal(h, r, ["移轉", "標臂", "處置", "信評"]);
            let refPrice = formatNumber(getColVal(h, r, ["買進參考價", "參考價"]), 2);
            let ytm = formatPercentage(getColVal(h, r, ["到期收益率", "收益率"]));
            let maturityYears = getColVal(h, r, ["距到期年", "到期年限", "年限"]);
            let accruedInterest = formatNumber(getColVal(h, r, ["前手息"]), 2);
            let qualification = getColVal(h, r, ["申購資格"]);

            let displayCols = [
                isin, issuer, currency, coupon, bondType, 
                freq, seniority, rating, refPrice, 
                ytm, maturityYears, accruedInterest, qualification
            ];

            displayCols.forEach((cellVal, idx) => {
                let cellClass = '';
                if (idx === 1) cellClass = 'text-left';
                else if (idx === 8 || idx === 11) cellClass = 'text-right';
                if (idx === 9) {
                    cellClass += ' highlight-orange';
                }
                htmlContent += `<td class="${cellClass}">${cellVal}</td>`;
            });

            htmlContent += `</tr>`;
        });

        htmlContent += `</tbody></table></div>`;
        container.innerHTML = htmlContent;
        document.getElementById('downloadImgBtn').style.display = 'block';
    }

    function downloadImage() {
        const captureElement = document.getElementById('captureArea');
        html2canvas(captureElement, { scale: 2, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `海外債券篩選報表_${today.replace(/\//g, '')}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
