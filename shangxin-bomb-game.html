<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c32">
<title>上新莊冷知識快問快答</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101c32;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif;
}
header{
 padding:26px 12px;
 text-align:center;
 background:linear-gradient(135deg,#172c4c,#294b73);
}
header h1{font-size:27px;margin:0 0 8px}
header p{color:#c5d5e8;margin:0}
main{max-width:850px;margin:auto;padding:15px}
.card{
 background:#1b2d48;
 border:1px solid #344c6b;
 border-radius:17px;
 padding:20px;
 margin-bottom:15px;
}
h2{margin:0 0 15px;font-size:21px}
input{
 width:100%;
 padding:14px;
 background:#101e33;
 border:1px solid #4c6585;
 border-radius:10px;
 color:#fff;
 font-size:17px;
}
label{display:block;margin:14px 0 7px}
button{
 border:0;
 border-radius:11px;
 padding:14px;
 background:#3679d1;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 min-height:48px;
}
button:disabled{opacity:.45;cursor:default}
.full{width:100%}
.gold{background:#f0b449;color:#17253a}
.gray{background:#344d6d}
.green{background:#168b70}
.hide{display:none!important}
.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 flex-wrap:wrap;
 gap:10px;
}
.badge{
 display:inline-block;
 background:#344c6b;
 padding:8px 12px;
 border-radius:20px;
 font-size:14px;
}
.notice{
 padding:13px;
 border-radius:11px;
 background:#263f60;
 line-height:1.7;
}
.muted{color:#b7c9e0;font-size:14px;line-height:1.7}
.center{text-align:center}
.timer{
 font-size:58px;
 font-weight:900;
 text-align:center;
 color:#ffd16e;
 margin:12px 0;
}
.timer.urgent{color:#ff6877}
.question{
 font-size:23px;
 font-weight:800;
 line-height:1.55;
 margin:20px 0;
}
.options{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.option{
 background:#31557d;
 min-height:90px;
 padding:15px;
 text-align:left;
 line-height:1.5;
}
.option.selected{background:#d89d32;color:#142238}
.option.correct{background:#138b6d}
.option.wrong{background:#a63c4c}
.option span{
 display:block;
 font-size:24px;
 margin-bottom:5px;
}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin:15px 0;
}
.stat{
 background:#263d5b;
 padding:12px 6px;
 border-radius:10px;
 text-align:center;
}
.stat strong{
 display:block;
 font-size:23px;
 color:#ffd16e;
}
.rank{
 display:grid;
 grid-template-columns:48px 1fr 95px;
 align-items:center;
 gap:10px;
 padding:13px 5px;
 border-bottom:1px solid #344c6b;
}
.rank.me{background:#304b6b;border-radius:9px}
.rank strong{text-align:right;color:#ffd16e}
.rank .place{font-size:21px;text-align:center}
.progress{
 height:9px;
 background:#354b68;
 border-radius:9px;
 overflow:hidden;
 margin:10px 0;
}
.progress div{
 height:100%;
 background:#f0b449;
 width:0;
 transition:width .2s;
}
.answer-stat{
 padding:10px 0;
 border-bottom:1px solid #344c6b;
}
.answer-stat b{color:#ffd16e}
#toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#f0b449;
 color:#15253c;
 padding:13px 18px;
 border-radius:12px;
 z-index:20;
 display:none;
 max-width:90%;
 text-align:center;
}
@media(max-width:480px){
 .options{grid-template-columns:1fr}
 .option{min-height:64px}
 .option span{display:inline;margin-right:12px;font-size:20px}
 .question{font-size:21px}
 .timer{font-size:48px}
}
</style>
</head>

<body>

<header>
<h1>🧠 上新莊冷知識快問快答</h1>
<p>10題挑戰・速度積分・即時排行榜</p>
</header>

<main>

<section id="entry" class="card">
<h2>🎮 加入遊戲</h2>
<div id="connection" class="notice">正在連接 Firebase...</div>

<label>房間代碼</label>
<input id="roomCode" maxlength="20" placeholder="例如 QUIZ888">

<label>你的暱稱</label>
<input id="nickname" maxlength="16" placeholder="請輸入姓名">

<br><br>
<button id="joinBtn" class="gold full" disabled>連線中...</button>

<p class="muted">
第一位建立房間的人自動成為主持人，不參賽。<br>
至少3位玩家即可開始。每題10秒，共10題。
</p>
</section>

<div id="game" class="hide">

<section class="card">
<div class="row">
<h2 id="roomTitle">遊戲房間</h2>
<span id="role" class="badge"></span>
</div>

<div id="phaseText" class="notice"></div>

<div class="stats">
<div class="stat"><strong id="playerCount">0</strong>玩家</div>
<div class="stat"><strong id="questionNumber">0/10</strong>題目</div>
<div class="stat"><strong id="answeredCount">0</strong>已作答</div>
</div>

<div class="row">
<button id="shareBtn" class="gray">📤 分享房間</button>
<button id="leaveBtn" class="gray">🚪 離開畫面</button>
</div>
</section>

<section id="hostPanel" class="card hide">
<h2>👑 主持人控制台</h2>

<div id="hostHelp" class="notice">
等待玩家加入，至少3位玩家即可開始。
</div>

<br>

<button id="startBtn" class="gold full hide">
▶️ 開始第1題
</button>

<button id="revealBtn" class="green full hide">
📊 公布本題答案
</button>

<button id="nextBtn" class="gold full hide">
➡️ 下一題
</button>

<button id="finishBtn" class="gold full hide">
🏆 公布最終排行榜
</button>

<br>
<button id="resetBtn" class="gray full">
🔄 重新開始10題
</button>
</section>

<section id="questionPanel" class="card hide">

<div class="row">
<span id="qBadge" class="badge">第1題</span>
<span id="doubleBadge" class="badge hide">🔥 雙倍積分</span>
</div>

<div id="timer" class="timer">10.0</div>
<div class="progress"><div id="timerBar"></div></div>

<div id="questionText" class="question"></div>

<div id="options" class="options"></div>

<p id="answerMessage" class="notice center">
請選擇答案
</p>

</section>

<section id="resultPanel" class="card hide">
<h2>🎯 本題結果</h2>

<div id="correctAnswer" class="notice"></div>
<div id="myResult" class="notice" style="margin-top:10px"></div>

<h2 style="margin-top:20px">📊 作答統計</h2>
<div id="answerStats"></div>

<p id="explanation" class="muted"></p>
</section>

<section id="rankPanel" class="card">
<h2 id="rankTitle">🏆 即時排行榜</h2>
<div id="rankList"></div>
</section>

<section class="card">
<h2>👥 玩家名單</h2>
<div id="playersList" class="muted"></div>
</section>

</div>
</main>

<div id="toast"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 signInAnonymously,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getFirestore,
 doc,
 collection,
 getDoc,
 onSnapshot,
 runTransaction,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* ============================
   Firebase 設定
============================ */

const firebaseConfig={
 apiKey:"AIzaSyByWLmFGZYZpwF60daHSxzTN22bUWXnHbQ",
 authDomain:"shangxin-bomb-game.firebaseapp.com",
 projectId:"shangxin-bomb-game",
 storageBucket:"shangxin-bomb-game.firebasestorage.app",
 messagingSenderId:"944292892956",
 appId:"1:944292892956:web:8fa456f6706d0c69686ad9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* ============================
   固定10題冷知識
============================ */

const QUESTIONS=[
 {
  q:"以下哪一種動物有三顆心臟？",
  options:["海豚","章魚","鯊魚","海龜"],
  answer:"B",
  explanation:"章魚有三顆心臟，其中兩顆負責將血液送往鰓。"
 },
 {
  q:"人體最大的器官是哪一個？",
  options:["肝臟","肺臟","皮膚","心臟"],
  answer:"C",
  explanation:"皮膚是人體最大的器官，具有保護、感覺及調節體溫等功能。"
 },
 {
  q:"下列哪一種動物屬於哺乳類？",
  options:["企鵝","海豚","鱷魚","海龜"],
  answer:"B",
  explanation:"海豚用肺呼吸，並以乳汁哺育幼兒，因此屬於哺乳類。"
 },
 {
  q:"太陽系中體積最大的行星是哪一顆？",
  options:["土星","海王星","木星","天王星"],
  answer:"C",
  explanation:"木星是太陽系中體積最大的行星。"
 },
 {
  q:"標準大氣壓下，純水的沸點約為攝氏幾度？",
  options:["90度","95度","100度","105度"],
  answer:"C",
  explanation:"在標準大氣壓下，純水的沸點約為攝氏100度。"
 },
 {
  q:"下列哪一種水果在植物學分類上屬於漿果？",
  options:["草莓","覆盆子","香蕉","黑莓"],
  answer:"C",
  explanation:"香蕉在植物學上屬於漿果；草莓、覆盆子與黑莓並非植物學定義的漿果。"
 },
 {
  q:"世界上面積最大的海洋是哪一個？",
  options:["大西洋","印度洋","太平洋","北冰洋"],
  answer:"C",
  explanation:"太平洋是地球上面積最大的海洋。"
 },
 {
  q:"下列哪一種金屬的化學元素符號是 Ag？",
  options:["金","銀","鋁","銅"],
  answer:"B",
  explanation:"Ag 是銀的元素符號；金是 Au、鋁是 Al、銅是 Cu。"
 },
 {
  q:"聲音在下列哪一種介質中通常傳播得最快？",
  options:["空氣","純水","鋼鐵","真空"],
  answer:"C",
  explanation:"在一般條件下，聲音在鋼鐵中的傳播速度高於水及空氣；真空無法傳聲。"
 },
 {
  q:"下列哪一顆行星的自轉方向與地球相反？",
  options:["火星","木星","金星","水星"],
  answer:"C",
  explanation:"金星為逆行自轉，其自轉方向與地球相反。"
 }
];

const LETTERS=["A","B","C","D"];
const QUESTION_MS=10000;


/* ============================
   狀態
============================ */

const $=id=>document.getElementById(id);

let uid="";
let roomId="";
let isHost=false;
let roomData=null;
let players=[];
let answers=[];
let ready=false;
let busy=false;

let unsubscribers=[];
let timerInterval=null;
let lastAutoRevealKey="";
let submitting=false;

const params=new URLSearchParams(location.search);

$("roomCode").value=params.get("room")||"";
$("nickname").value=localStorage.getItem("quizNickname")||"";


/* ============================
   工具
============================ */

function show(id,value){
 $(id).classList.toggle("hide",!value);
}

function toast(message){
 const el=$("toast");
 el.textContent=message;
 el.style.display="block";
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>el.style.display="none",3000);
}

function fail(e){
 console.error(e);
 alert("操作失敗："+(e.message||e));
}

function roomRef(){
 return doc(db,"quizRooms",roomId);
}

function answerRef(id,index,session){
 return doc(
  db,"quizRooms",roomId,"answers",
  `${id}_${session}_${index}`
 );
}

function questionStart(){
 return roomData?.questionStartedAt?.toMillis?.()||0;
}

function currentQuestion(){
 return QUESTIONS[roomData?.questionIndex]||null;
}

function currentAnswers(){
 if(!roomData||roomData.questionIndex<0)return [];

 return answers.filter(a=>
  a.session===roomData.session &&
  a.questionIndex===roomData.questionIndex
 );
}

function myAnswer(){
 return currentAnswers().find(a=>a.uid===uid);
}

function getScore(a){

 if(!roomData||!a?.submittedAt)return 0;

 const q=QUESTIONS[a.questionIndex];

 if(!q||a.choice!==q.answer)return 0;

 const key=`${a.session}_${a.questionIndex}`;

 const start=roomData.starts?.[key];

 if(!start?.toMillis)return 0;

 const ms=a.submittedAt.toMillis()-start.toMillis();

 if(ms<0||ms>=QUESTION_MS)return 0;

 let score=600;

 if(ms<=2000)score=1000;
 else if(ms<=4000)score=900;
 else if(ms<=6000)score=800;
 else if(ms<=8000)score=700;

 return a.questionIndex===9?score*2:score;
}

function leaderboard(){

 if(!roomData)return [];

 const result=players.map(p=>{

  const mine=answers.filter(a=>
   a.uid===p.id &&
   a.session===roomData.session &&
   a.questionIndex<=roomData.questionIndex &&
   (
    a.questionIndex<roomData.questionIndex ||
    roomData.phase==="results" ||
    roomData.phase==="finished"
   )
  );

  const total=mine.reduce(
   (sum,a)=>sum+getScore(a),0
  );

  const correct=mine.filter(a=>getScore(a)>0).length;

  const time=mine.reduce((sum,a)=>{

   if(!getScore(a))return sum;

   const start=roomData.starts?.[
    `${a.session}_${a.questionIndex}`
   ];

   if(!start?.toMillis||!a.submittedAt)return sum;

   return sum+Math.max(
    0,
    a.submittedAt.toMillis()-start.toMillis()
   );

  },0);

  return {...p,total,correct,time};

 });

 result.sort((a,b)=>
  b.total-a.total ||
  b.correct-a.correct ||
  a.time-b.time ||
  a.name.localeCompare(b.name,"zh-TW")
 );

 return result;
}


/* ============================
   Firebase 登入
============================ */

onAuthStateChanged(auth,user=>{
 if(!user)return;

 uid=user.uid;
 ready=true;

 $("connection").textContent="✅ Firebase 已連線";
 $("joinBtn").disabled=false;
 $("joinBtn").textContent="加入／建立房間";
});

signInAnonymously(auth).catch(fail);


/* ============================
   加入房間
============================ */

$("joinBtn").onclick=async()=>{

 if(!ready||busy)return;

 const code=$("roomCode").value.trim()
  .toUpperCase()
  .replace(/[^A-Z0-9_-]/g,"")
  .slice(0,20);

 const nick=$("nickname").value.trim().slice(0,16);

 if(!code||!nick){
  alert("請輸入房間代碼與暱稱");
  return;
 }

 busy=true;
 $("joinBtn").disabled=true;

 try{

  const ref=doc(db,"quizRooms",code);

  await runTransaction(db,async tx=>{

   const snap=await tx.get(ref);

   if(!snap.exists()){

    tx.set(ref,{
     hostUid:uid,
     phase:"lobby",
     questionIndex:-1,
     questionStartedAt:null,
     revealAt:null,
     session:1,
     starts:{},
     createdAt:serverTimestamp()
    });

   }

  });

  const snap=await getDoc(ref);
  const data=snap.data();

  const host=data.hostUid===uid;

  if(!host){

   const pref=doc(
    db,"quizRooms",code,"players",uid
   );

   const existing=await getDoc(pref);

   if(!existing.exists()){

    if(data.phase!=="lobby"){
     throw Error("遊戲已開始，無法加入");
    }

    await setDoc(pref,{
     name:nick,
     joinedAt:serverTimestamp()
    });

   }

  }

  cleanup();

  roomId=code;
  isHost=host;
  roomData=null;
  players=[];
  answers=[];
  lastAutoRevealKey="";

  localStorage.setItem("quizNickname",nick);

  show("entry",false);
  show("game",true);

  history.replaceState(
   {}, "",
   location.pathname+"?room="+encodeURIComponent(code)
  );

  subscribe();

 }catch(e){
  fail(e);
 }finally{
  busy=false;
  $("joinBtn").disabled=false;
 }

};


/* ============================
   即時監聽
============================ */

function subscribe(){

 unsubscribers.push(

  onSnapshot(roomRef(),snap=>{

   if(!snap.exists())return;

   roomData=snap.data();

   render();
   updateTimer();

  },fail)

 );

 unsubscribers.push(

  onSnapshot(
   collection(db,"quizRooms",roomId,"players"),
   snap=>{

    players=snap.docs.map(d=>({
     id:d.id,
     ...d.data()
    }));

    render();

   },
   fail
  )

 );

 unsubscribers.push(

  onSnapshot(
   collection(db,"quizRooms",roomId,"answers"),
   snap=>{

    answers=snap.docs.map(d=>({
     id:d.id,
     ...d.data()
    }));

    render();

   },
   fail
  )

 );

 timerInterval=setInterval(updateTimer,150);

}

function cleanup(){

 unsubscribers.forEach(fn=>fn());
 unsubscribers=[];

 clearInterval(timerInterval);
 timerInterval=null;

}


/* ============================
   畫面
============================ */

function render(){

 if(!roomData)return;

 const d=roomData;
 const index=d.questionIndex;
 const q=currentQuestion();
 const current=currentAnswers();

 $("roomTitle").textContent="房間："+roomId;
 $("role").textContent=isHost?"👑 主持人":"🎮 玩家";

 $("playerCount").textContent=players.length;

 $("questionNumber").textContent=
  index<0?"0/10":`${index+1}/10`;

 $("answeredCount").textContent=current.length;

 const phases={
  lobby:"⏳ 等待玩家加入",
  question:"⚡ 快問快答進行中",
  results:"📊 本題結果已公布",
  finished:"🏆 10題挑戰完成！"
 };

 $("phaseText").textContent=phases[d.phase]||"";

 show("hostPanel",isHost);

 show("startBtn",isHost&&d.phase==="lobby");
 show("revealBtn",isHost&&d.phase==="question");
 show("nextBtn",isHost&&d.phase==="results"&&index<9);
 show("finishBtn",isHost&&d.phase==="results"&&index===9);

 $("startBtn").disabled=busy||players.length<3;

 $("revealBtn").disabled=
  busy||Date.now()<questionStart()+QUESTION_MS;

 $("nextBtn").disabled=busy;
 $("finishBtn").disabled=busy;
 $("resetBtn").disabled=busy;

 $("hostHelp").textContent=
  d.phase==="lobby"
  ?`目前${players.length}位玩家，至少3位即可開始。`
  :d.phase==="question"
  ?`目前已作答 ${current.length}/${players.length} 人。10秒結束後公布答案。`
  :d.phase==="results"
  ?"答案已公布，可以進入下一題。"
  :"比賽已完成，可以重新開始。";

 show(
  "questionPanel",
  d.phase==="question"||d.phase==="results"
 );

 show(
  "resultPanel",
  d.phase==="results"||d.phase==="finished"
 );

 if(q&&(d.phase==="question"||d.phase==="results")){

  $("qBadge").textContent=`第 ${index+1} / 10 題`;

  show("doubleBadge",index===9);

  $("questionText").textContent=q.q;

  const selected=myAnswer()?.choice;
  const opts=$("options");

  opts.replaceChildren();

  LETTERS.forEach((letter,i)=>{

   const btn=document.createElement("button");
   btn.className="option";

   const mark=document.createElement("span");
   mark.textContent=letter+".";

   const label=document.createTextNode(q.options[i]);

   btn.append(mark,label);

   if(selected===letter){
    btn.classList.add("selected");
   }

   if(d.phase==="results"){

    if(letter===q.answer){
     btn.classList.add("correct");
    }else if(selected===letter){
     btn.classList.add("wrong");
    }

   }

   btn.disabled=
    isHost||
    d.phase!=="question"||
    !!selected||
    submitting||
    Date.now()>=questionStart()+QUESTION_MS;

   btn.onclick=()=>submitAnswer(letter);

   opts.append(btn);

  });

  $("answerMessage").textContent=
   isHost
   ?"👑 主持人不參賽，請等待玩家作答。"
   :d.phase==="results"
   ?"本題已結束"
   :selected
   ?`✅ 已送出 ${selected}，等待公布答案`
   :Date.now()>=questionStart()+QUESTION_MS
   ?"⏰ 作答時間結束"
   :"請在10秒內選擇答案，送出後不可更改。";

 }

 if(d.phase==="results"&&q){

  const correctIndex=LETTERS.indexOf(q.answer);

  $("correctAnswer").textContent=
   `✅ 正確答案：${q.answer}. ${q.options[correctIndex]}`;

  $("explanation").textContent="💡 "+q.explanation;

  const mine=myAnswer();

  $("myResult").textContent=isHost
   ?"主持人不計分"
   :mine
   ?`本題得分：${getScore(mine).toLocaleString()} 分`
   :"本題未作答：0分";

  const stats=$("answerStats");
  stats.replaceChildren();

  LETTERS.forEach((letter,i)=>{

   const count=current.filter(a=>a.choice===letter).length;

   const div=document.createElement("div");
   div.className="answer-stat";

   const b=document.createElement("b");
   b.textContent=`${letter}. ${q.options[i]}`;

   div.append(
    b,
    document.createTextNode(`　${count}人`)
   );

   stats.append(div);

  });

 }

 if(d.phase==="finished"){

  $("correctAnswer").textContent=
   "🎉 全部10題結束！恭喜完成挑戰！";

  $("myResult").textContent=isHost
   ?"主持人不參賽"
   :`你的總分：${
      leaderboard().find(p=>p.id===uid)?.total||0
    } 分`;

  $("answerStats").replaceChildren();
  $("explanation").textContent="";

 }

 renderRanks();
 renderPlayers();

}


/* ============================
   排行榜
============================ */

function renderRanks(){

 const list=$("rankList");
 list.replaceChildren();

 if(!roomData)return;

 const ranking=leaderboard();

 $("rankTitle").textContent=
  roomData.phase==="finished"
  ?"🏆 最終總排行榜"
  :"🏆 即時累積排行榜";

 if(!ranking.length){
  list.textContent="等待玩家加入...";
  return;
 }

 ranking.forEach((p,i)=>{

  const row=document.createElement("div");
  row.className="rank";

  if(p.id===uid)row.classList.add("me");

  const place=document.createElement("span");
  place.className="place";

  place.textContent=
   ["🥇","🥈","🥉"][i]||`${i+1}`;

  const name=document.createElement("span");
  name.textContent=
   p.name+(p.id===uid?"（我）":"");

  const score=document.createElement("strong");
  score.textContent=p.total.toLocaleString()+"分";

  row.append(place,name,score);
  list.append(row);

 });

}

function renderPlayers(){

 const list=$("playersList");
 list.replaceChildren();

 players.forEach(p=>{

  const div=document.createElement("div");
  div.style.padding="7px 0";

  div.textContent=
   "👤 "+p.name+(p.id===uid?"（我）":"");

  list.append(div);

 });

}


/* ============================
   倒數計時
============================ */

function updateTimer(){

 if(!roomData||roomData.phase!=="question")return;

 const start=questionStart();
 if(!start)return;

 const remaining=Math.max(
  0,
  QUESTION_MS-(Date.now()-start)
 );

 $("timer").textContent=
  (remaining/1000).toFixed(1);

 $("timer").classList.toggle(
  "urgent",remaining<=3000
 );

 $("timerBar").style.width=
  (remaining/QUESTION_MS*100)+"%";

 if(remaining===0){

  $("answerMessage").textContent=
   myAnswer()
   ?"✅ 已送出答案，等待公布"
   :"⏰ 時間到！";

  $("options").querySelectorAll("button")
   .forEach(b=>b.disabled=true);

  if(isHost){
   autoReveal();
  }

 }

}

async function autoReveal(){

 const key=`${roomData.session}_${roomData.questionIndex}`;

 if(lastAutoRevealKey===key||busy)return;

 lastAutoRevealKey=key;

 try{
  await revealQuestion();
 }catch(e){
  console.error(e);
  lastAutoRevealKey="";
 }

}


/* ============================
   玩家送出答案
============================ */

async function submitAnswer(choice){

 if(
  isHost||
  submitting||
  !roomData||
  roomData.phase!=="question"||
  myAnswer()
 )return;

 if(Date.now()>=questionStart()+QUESTION_MS){
  toast("⏰ 作答時間已結束");
  return;
 }

 submitting=true;
 render();

 try{

  const index=roomData.questionIndex;
  const session=roomData.session;

  await setDoc(
   answerRef(uid,index,session),
   {
    uid,
    session,
    questionIndex:index,
    choice,
    submittedAt:serverTimestamp()
   }
  );

  toast("✅ 答案已送出！");

 }catch(e){
  fail(e);
 }finally{
  submitting=false;
  render();
 }

}


/* ============================
   主持人：開始題目
============================ */

async function startQuestion(nextIndex){

 if(!isHost||busy)return;

 busy=true;

 try{

  await runTransaction(db,async tx=>{

   const ref=roomRef();
   const snap=await tx.get(ref);
   const d=snap.data();

   if(!d||d.hostUid!==uid){
    throw Error("只有主持人可以操作");
   }

   if(nextIndex===0){

    if(d.phase!=="lobby"){
     throw Error("遊戲已開始");
    }

    if(players.length<3){
     throw Error("至少需要3位玩家");
    }

   }else{

    if(
     d.phase!=="results"||
     d.questionIndex!==nextIndex-1
    ){
     throw Error("目前無法開始下一題");
    }

   }

   const key=`${d.session}_${nextIndex}`;

   tx.update(ref,{
    phase:"question",
    questionIndex:nextIndex,
    questionStartedAt:serverTimestamp(),
    revealAt:null,
    starts:{
     ...(d.starts||{}),
     [key]:serverTimestamp()
    }
   });

  });

  toast(`⚡ 第${nextIndex+1}題開始！`);

 }catch(e){
  fail(e);
 }finally{
  busy=false;
  render();
 }

}


/* ============================
   主持人：公布答案
============================ */

async function revealQuestion(){

 if(!isHost||busy)return;

 busy=true;

 try{

  await runTransaction(db,async tx=>{

   const ref=roomRef();
   const snap=await tx.get(ref);
   const d=snap.data();

   if(!d||d.phase!=="question"){
    throw Error("本題已公布");
   }

   const started=d.questionStartedAt?.toMillis?.();

   if(!started||Date.now()<started+10000){
    throw Error("尚未到公布時間");
   }

   tx.update(ref,{
    phase:"results",
    revealAt:serverTimestamp()
   });

  });

  toast("📊 正確答案已公布");

 }finally{
  busy=false;
  render();
 }

}


/* ============================
   主持人：結束比賽
============================ */

async function finishGame(){

 if(!isHost||busy)return;

 busy=true;

 try{

  await runTransaction(db,async tx=>{

   const ref=roomRef();
   const snap=await tx.get(ref);
   const d=snap.data();

   if(d.phase!=="results"||d.questionIndex!==9){
    throw Error("必須完成10題才能結束");
   }

   tx.update(ref,{phase:"finished"});

  });

  toast("🏆 最終排行榜公布！");

 }catch(e){
  fail(e);
 }finally{
  busy=false;
  render();
 }

}


/* ============================
   主持人：重新開始
============================ */

async function resetGame(){

 if(!isHost||busy)return;

 if(!confirm("確定重新開始10題？所有玩家分數歸零。")){
  return;
 }

 busy=true;

 try{

  await runTransaction(db,async tx=>{

   const ref=roomRef();
   const snap=await tx.get(ref);
   const d=snap.data();

   if(d.hostUid!==uid){
    throw Error("只有主持人可以重設");
   }

   tx.update(ref,{
    phase:"lobby",
    questionIndex:-1,
    questionStartedAt:null,
    revealAt:null,
    session:d.session+1,
    starts:{}
   });

  });

  lastAutoRevealKey="";

  toast("🔄 遊戲已重設");

 }catch(e){
  fail(e);
 }finally{
  busy=false;
  render();
 }

}


/* ============================
   按鈕事件
============================ */

$("startBtn").onclick=()=>startQuestion(0);

$("nextBtn").onclick=()=>{
 startQuestion(roomData.questionIndex+1);
};

$("revealBtn").onclick=async()=>{
 try{
  await revealQuestion();
 }catch(e){
  fail(e);
 }
};

$("finishBtn").onclick=finishGame;
$("resetBtn").onclick=resetGame;

$("shareBtn").onclick=async()=>{

 const url=location.origin+location.pathname+
  "?room="+encodeURIComponent(roomId);

 try{

  if(navigator.share){
   await navigator.share({
    title:"上新莊冷知識快問快答",
    url
   });
  }else{
   await navigator.clipboard.writeText(url);
   toast("房間連結已複製");
  }

 }catch(e){
  if(e.name!=="AbortError"){
   prompt("請複製連結",url);
  }
 }

};

$("leaveBtn").onclick=()=>{

 cleanup();

 roomId="";
 roomData=null;
 players=[];
 answers=[];
 isHost=false;

 show("game",false);
 show("entry",true);

 history.replaceState({}, "",location.pathname);

};

</script>
