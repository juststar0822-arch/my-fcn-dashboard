<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<title>上新莊冷知識快問快答</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101b31;
  color:white;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

header{
  background:#24476e;
  padding:25px 12px;
  text-align:center;
}

h1{font-size:27px;margin:0}

header p{color:#cbd9e9}

main{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1b2e49;
  border:1px solid #3c5677;
  border-radius:16px;
  padding:20px;
  margin-bottom:15px;
}

.hide{display:none!important}

input{
  width:100%;
  padding:14px;
  font-size:18px;
  margin:10px 0 18px;
  background:#11243c;
  color:white;
  border:1px solid #6684a6;
  border-radius:9px;
}

button{
  background:#367bd1;
  color:white;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  min-height:48px;
}

button:disabled{opacity:.5}

.full{
  width:100%;
  margin:5px 0;
}

.gold{
  background:#eeb44a;
  color:#182940;
}

.gray{background:#405878}

.notice{
  background:#2a4565;
  padding:13px;
  border-radius:10px;
  line-height:1.7;
  white-space:pre-line;
}

.muted{color:#b9cee3}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.stats{
  display:flex;
  justify-content:space-around;
  background:#28405c;
  padding:12px;
  border-radius:10px;
  margin:12px 0;
}

.stats b{color:#ffd06a}

.timer{
  text-align:center;
  font-size:60px;
  color:#ffd06a;
  font-weight:900;
}

.question{
  font-size:24px;
  font-weight:bold;
  line-height:1.5;
  margin:20px 0;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  background:#345a82;
  text-align:left;
  min-height:75px;
}

.selected{
  background:#e2ad49;
  color:#14243b;
}

.correct{background:#16866b}

.wrong{background:#a83b4c}

.rank{
  display:flex;
  justify-content:space-between;
  padding:13px;
  border-bottom:1px solid #415978;
}

.rank.me{background:#385474}

.record{
  background:#29425f;
  margin:9px 0;
  border-radius:9px;
}

.record summary{
  padding:13px;
  cursor:pointer;
}

.record div{
  padding:12px;
  line-height:1.8;
}

.good{background:#17614f}

.bad{background:#693243}

#error{
  background:#742f42;
  color:white;
}

#toast{
  position:fixed;
  bottom:20px;
  left:10%;
  width:80%;
  text-align:center;
  background:#f0b94d;
  color:#182940;
  border-radius:10px;
  padding:12px;
  display:none;
  z-index:999;
}

@media(max-width:550px){
  .options{grid-template-columns:1fr}
  .question{font-size:21px}
}
</style>
</head>

<body>

<header>
  <h1>🧠 上新莊冷知識快問快答</h1>
  <p>100題題庫｜隨機10題｜速度積分挑戰</p>
</header>

<main>

<section id="entry" class="card">

  <h2>🎮 加入遊戲</h2>

  <div id="connection" class="notice">
    正在連接 Firebase…
  </div>

  <div id="error" class="notice hide"></div>

  <p>房間代碼</p>
  <input id="roomCode" placeholder="例如 QUIZ888" maxlength="20">

  <p>你的暱稱</p>
  <input id="nickname" placeholder="請輸入姓名" maxlength="16">

  <button id="join" class="gold full" disabled>
    連線中…
  </button>

  <p class="muted">
    第一位建立房間的人是主持人，不參賽。<br>
    至少3位玩家才能開始。<br>
    每題10秒，第10題雙倍積分。
  </p>

</section>

<div id="game" class="hide">

<section class="card">

  <div class="row">
    <h2 id="roomTitle"></h2>
    <b id="role"></b>
  </div>

  <div id="phase" class="notice"></div>

  <div class="stats">
    <span>玩家 <b id="count">0</b></span>
    <span>題目 <b id="number">0/10</b></span>
    <span>已答 <b id="answered">0</b></span>
  </div>

  <div class="row">
    <button id="share" class="gray">📤 分享房間</button>
    <button id="leave" class="gray">🚪 離開畫面</button>
  </div>

</section>

<section id="hostPanel" class="card hide">

  <h2>👑 主持人控制台</h2>

  <div id="hostInfo" class="notice"></div>

  <button id="start" class="gold full hide">
    ▶ 開始第1題
  </button>

  <button id="reveal" class="full hide">
    📊 公布答案
  </button>

  <button id="next" class="gold full hide">
    ➡ 下一題
  </button>

  <button id="finish" class="gold full hide">
    🏆 公布最終排名
  </button>

  <button id="reset" class="gray full">
    🔄 重新抽題開始新一場
  </button>

</section>

<section id="questionPanel" class="card hide">

  <div class="row">
    <b id="qLabel"></b>
    <b id="double" class="hide">🔥 雙倍積分</b>
  </div>

  <div id="timer" class="timer">10.0</div>

  <div id="qText" class="question"></div>

  <div id="options" class="options"></div>

  <p id="answerInfo" class="notice">
    請選擇答案
  </p>

</section>

<section id="resultPanel" class="card hide">

  <h2>🎯 本題結果</h2>

  <div id="correctInfo" class="notice"></div>

  <br>

  <div id="myResult" class="notice"></div>

  <p id="explain" class="muted"></p>

  <h3>📊 選項統計</h3>

  <div id="optionStats"></div>

</section>

<section class="card">

  <h2 id="rankTitle">🏆 即時排行榜</h2>

  <div id="ranks">等待玩家…</div>

</section>

<section id="personal" class="card hide">

  <h2>📋 我的10題作答紀錄</h2>

  <div id="summary"></div>

  <div id="records"></div>

</section>

<section class="card">

  <h2>👥 玩家名單</h2>

  <div id="playerList"></div>

</section>

</div>

</main>

<div id="toast"></div>

/* ==========================
   基本設定
========================== */

const $ = id => document.getElementById(id);

const show = (id,on) => {
  $(id).classList.toggle("hide",!on);
};

const LETTERS = ["A","B","C","D"];

const COL = "triviaRoomsV4";

let db;
let auth;
let uid = "";
let roomId = "";
let isHost = false;
let room = null;
let players = [];
let answers = [];
let busy = false;
let submitting = false;
let unsubs = [];
let ticker = null;
let autoKey = "";
let pendingChoice = null;
let sessionToken = 0;

const params = new URLSearchParams(location.search);

$("roomCode").value = params.get("room") || "";
$("nickname").value = localStorage.getItem("quizNick") || "";


/* ==========================
   提示訊息
========================== */

function toast(s){
  $("toast").textContent = s;
  $("toast").style.display = "block";

  setTimeout(()=>{
    $("toast").style.display = "none";
  },2500);
}

function error(e){
  console.error(e);
  alert("操作失敗：" + (e?.message || String(e)));
}

function connectError(e){

  console.error(e);

  $("connection").textContent = "❌ Firebase 連線失敗";

  $("error").textContent =
    "錯誤代碼：" + (e?.code || "unknown") +
    "\n" + (e?.message || String(e)) +
    "\n請檢查 Firebase 匿名登入、授權網域及網路連線。";

  show("error",true);
}


/* ==========================
   Firebase 登入
========================== */

try{

  const app = initializeApp(firebaseConfig);

  auth = getAuth(app);
  db = getFirestore(app);

  onAuthStateChanged(auth,user=>{

    if(user){

      uid = user.uid;

      $("connection").textContent = "✅ Firebase 已連線";

      $("join").disabled = false;
      $("join").textContent = "加入／建立房間";

      show("error",false);

    }else{

      $("connection").textContent = "正在登入 Firebase…";
      $("join").disabled = true;

    }

  },connectError);

  signInAnonymously(auth).catch(connectError);

}catch(e){

  connectError(e);

}


/* ==========================
   Firestore 路徑
========================== */

const ref = () => doc(db,COL,roomId);

const aRef = (id,s,i) =>
  doc(db,COL,roomId,"answers",`${id}_${s}_${i}`);


/* ==========================
   題目隨機抽選
========================== */

function shuffle(arr){

  const a = [...arr];

  for(let i=a.length-1;i>0;i--){

    const j = Math.floor(Math.random()*(i+1));

    [a[i],a[j]] = [a[j],a[i]];

  }

  return a;
}

function picks(){

  return shuffle(
    Array.from({length:BANK.length},(_,i)=>i)
  )
  .slice(0,10)
  .map(id=>({
    id,
    order:shuffle([0,1,2,3])
  }));

}

function question(i){

  const p = room?.picks?.[i];

  if(!p)return null;

  const x = BANK[p.id];

  return {
    text:x[0],
    options:p.order.map(j=>x[j+1]),
    correct:p.order.indexOf(0),
    explain:x[5]
  };

}


/* ==========================
   時間、答案與計分
========================== */

function time(t){
  return t?.toMillis?.() || 0;
}

function startTime(i){
  return time(room?.starts?.["q"+i]);
}

function mine(i=room?.questionIndex){

  return answers.find(a=>
    a.uid===uid &&
    a.session===room?.session &&
    a.questionIndex===i
  );

}

function currentAnswers(){

  return answers.filter(a=>
    a.session===room?.session &&
    a.questionIndex===room?.questionIndex
  );

}

function revealed(i){

  return room?.phase==="finished" ||
    i<room?.questionIndex ||
    (
      i===room?.questionIndex &&
      room?.phase==="results"
    );

}

function points(a){

  if(!a || !room)return 0;

  const q = question(a.questionIndex);

  if(!q || a.choice!==q.correct)return 0;

  const ms =
    time(a.submittedAt) -
    startTime(a.questionIndex);

  if(ms<0 || ms>=10000)return 0;

  let n;

  if(ms<=2000)n=1000;
  else if(ms<=4000)n=900;
  else if(ms<=6000)n=800;
  else if(ms<=8000)n=700;
  else n=600;

  return n*(a.questionIndex===9?2:1);

}


/* ==========================
   排行榜
========================== */

function ranking(){

  return players.map(p=>{

    const aa = answers.filter(a=>
      a.uid===p.id &&
      a.session===room?.session &&
      revealed(a.questionIndex)
    );

    return {
      ...p,

      score:aa.reduce(
        (s,a)=>s+points(a),0
      ),

      correct:aa.filter(
        a=>points(a)>0
      ).length,

      time:aa.reduce(
        (s,a)=>s+(
          points(a)>0
          ?Math.max(
            0,
            time(a.submittedAt)-startTime(a.questionIndex)
          )
          :0
        ),0
      )
    };

  }).sort((a,b)=>
    b.score-a.score ||
    b.correct-a.correct ||
    a.time-b.time ||
    a.name.localeCompare(b.name,"zh-TW")
  );

}


/* ==========================
   加入／建立房間
========================== */

$("join").onclick = async()=>{

  if(busy || !uid)return;

  const code = $("roomCode")
    .value.trim().toUpperCase()
    .replace(/[^A-Z0-9_-]/g,"")
    .slice(0,20);

  const nick = $("nickname")
    .value.trim().slice(0,16);

  if(!code || !nick){

    alert("請輸入房間代碼與暱稱");
    return;

  }

  busy = true;
  $("join").disabled = true;

  try{

    const r = doc(db,COL,code);

    await runTransaction(db,async tx=>{

      const d = await tx.get(r);

      if(!d.exists()){

        tx.set(r,{
          hostUid:uid,
          phase:"lobby",
          session:1,
          questionIndex:-1,
          questionStartedAt:null,
          picks:[],
          starts:{},
          createdAt:serverTimestamp()
        });

      }

    });

    const snap = await getDoc(r);

    const d = snap.data();

    const host = d.hostUid===uid;

    if(!host){

      const pr = doc(db,COL,code,"players",uid);

      if(!(await getDoc(pr)).exists()){

        if(d.phase!=="lobby"){
          throw Error("遊戲已開始，無法加入");
        }

        await setDoc(pr,{
          name:nick,
          joinedAt:serverTimestamp()
        });

      }

    }

    cleanup();

    roomId = code;
    isHost = host;

    room = null;
    players = [];
    answers = [];

    autoKey = "";
    pendingChoice = null;

    localStorage.setItem("quizNick",nick);

    show("entry",false);
    show("game",true);

    history.replaceState(
      {},
      "",
      location.pathname+"?room="+encodeURIComponent(code)
    );

    subscribe();

  }catch(e){

    error(e);

  }finally{

    busy = false;
    $("join").disabled = !uid;

  }

};


/* ==========================
   即時同步
========================== */

function cleanup(){

  sessionToken++;

  unsubs.forEach(f=>f());

  unsubs = [];

  clearInterval(ticker);
  ticker = null;

}

function subscribe(){

  const token = sessionToken;

  unsubs.push(
    onSnapshot(ref(),s=>{

      if(token!==sessionToken)return;

      if(s.exists()){
        room=s.data();
        render();
      }

    },error)
  );

  unsubs.push(
    onSnapshot(
      collection(db,COL,roomId,"players"),
      s=>{

        if(token!==sessionToken)return;

        players=s.docs.map(x=>({
          id:x.id,
          ...x.data()
        }));

        render();

      },error
    )
  );

  unsubs.push(
    onSnapshot(
      collection(db,COL,roomId,"answers"),
      s=>{

        if(token!==sessionToken)return;

        answers=s.docs.map(x=>({
          id:x.id,
          ...x.data()
        }));

        render();

      },error
    )
  );

  ticker=setInterval(tick,150);

}


/* ==========================
   畫面更新
========================== */

function render(){

  if(!room)return;

  const i=room.questionIndex;

  const q=question(i);

  const ca=currentAnswers();

  $("roomTitle").textContent="房間："+roomId;

  $("role").textContent=
    isHost?"👑 主持人":"🎮 玩家";

  $("count").textContent=players.length;

  $("number").textContent=
    i<0?"0/10":`${i+1}/10`;

  $("answered").textContent=ca.length;

  $("phase").textContent=({
    lobby:"⏳ 等待玩家加入",
    question:"⚡ 題目進行中",
    results:"📊 本題答案已公布",
    finished:"🏆 全部10題完成"
  })[room.phase];

  show("hostPanel",isHost);

  show(
    "start",
    isHost && room.phase==="lobby"
  );

  show(
    "reveal",
    isHost && room.phase==="question"
  );

  show(
    "next",
    isHost &&
    room.phase==="results" &&
    i<9
  );

  show(
    "finish",
    isHost &&
    room.phase==="results" &&
    i===9
  );

  $("start").disabled=
    busy || players.length<3;

  $("reveal").disabled=
    busy ||
    Date.now()<time(room.questionStartedAt)+10000;

  $("hostInfo").textContent=
    room.phase==="lobby"
    ?`目前${players.length}位玩家，至少3位才能開始。`
    :room.phase==="question"
    ?`已作答 ${ca.length}/${players.length} 人，10秒後自動公布。`
    :room.phase==="results"
    ?"請按下一題。"
    :"可以重新抽題開始新一場。";

  show(
    "questionPanel",
    room.phase==="question" ||
    room.phase==="results"
  );

  show(
    "resultPanel",
    room.phase==="results"
  );

  show(
    "personal",
    room.phase==="finished" && !isHost
  );

  if(q && (
    room.phase==="question" ||
    room.phase==="results"
  )){
    renderQuestion(q);
  }

  if(q && room.phase==="results"){
    renderResult(q);
  }

  if(room.phase==="finished" && !isHost){
    renderPersonal();
  }

  renderRank();

  $("playerList").replaceChildren(
    ...players.map(p=>{

      const d=document.createElement("p");

      d.textContent=
        "👤 "+p.name+
        (p.id===uid?"（我）":"");

      return d;

    })
  );

  tick();

}


/* ==========================
   題目顯示
========================== */

function renderQuestion(q){

  $("qLabel").textContent=
    `第${room.questionIndex+1}/10題`;

  show("double",room.questionIndex===9);

  $("qText").textContent=q.text;

  const a=mine();

  const selected=
    a?.choice??pendingChoice;

  $("options").replaceChildren(
    ...q.options.map((v,i)=>{

      const b=document.createElement("button");

      b.className="option";

      b.textContent=LETTERS[i]+". "+v;

      if(selected===i){
        b.classList.add("selected");
      }

      if(room.phase==="results"){

        if(i===q.correct){
          b.classList.add("correct");
        }else if(i===selected){
          b.classList.add("wrong");
        }

      }

      b.disabled=
        isHost ||
        room.phase!=="question" ||
        (selected!==null && selected!==undefined) ||
        submitting ||
        Date.now()>=time(room.questionStartedAt)+10000;

      b.onclick=()=>submit(i);

      return b;

    })
  );

  $("answerInfo").textContent=
    isHost
    ?"主持人不參賽"
    :room.phase==="results"
    ?"本題結束，請查看結果"
    :a
    ?`✅ 已送出 ${LETTERS[a.choice]}，等待公布`
    :pendingChoice!==null
    ?"正在送出答案…"
    :"請在10秒內作答，送出後不能更改";

}


/* ==========================
   每題結果
========================== */

function renderResult(q){

  $("correctInfo").textContent=
    `✅ 正確答案：${LETTERS[q.correct]}. ${q.options[q.correct]}`;

  $("explain").textContent="💡 "+q.explain;

  const a=mine();

  const box=$("myResult");

  box.className="notice";

  const rank=ranking();

  const me=rank.find(p=>p.id===uid);

  const place=rank.findIndex(p=>p.id===uid)+1;

  if(isHost){

    box.textContent="👑 主持人不計分";

  }else if(!a){

    box.textContent="⏰ 未作答｜本題0分";

  }else if(a.choice===q.correct){

    box.classList.add("good");

    box.textContent=
      `✅ 答對！你的答案：${LETTERS[a.choice]} ${q.options[a.choice]}\n`+
      `本題 +${points(a)} 分｜累積 ${me?.score||0} 分｜目前第 ${place} 名`;

  }else{

    box.classList.add("bad");

    box.textContent=
      `❌ 答錯！你的答案：${LETTERS[a.choice]} ${q.options[a.choice]}\n`+
      `正確答案：${LETTERS[q.correct]} ${q.options[q.correct]}｜本題0分`;

  }

  $("optionStats").replaceChildren(
    ...q.options.map((v,i)=>{

      const p=document.createElement("p");

      p.textContent=
        `${LETTERS[i]}. ${v}：`+
        `${currentAnswers().filter(a=>a.choice===i).length}人`;

      return p;

    })
  );

}


/* ==========================
   排名顯示
========================== */

function renderRank(){

  const r=ranking();

  $("rankTitle").textContent=
    room.phase==="finished"
    ?"🏆 最終排行榜"
    :"🏆 即時排行榜";

  $("ranks").replaceChildren(
    ...r.map((p,i)=>{

      const d=document.createElement("div");

      d.className=
        "rank"+(p.id===uid?" me":"");

      const n=document.createElement("span");
      const s=document.createElement("b");

      n.textContent=
        (["🥇","🥈","🥉"][i]||`${i+1}.`)+
        " "+p.name+
        (p.id===uid?"（我）":"");

      s.textContent=
        p.score.toLocaleString()+"分";

      d.append(n,s);

      return d;

    })
  );

  if(!r.length){
    $("ranks").textContent="等待玩家…";
  }

}


/* ==========================
   最終個人作答紀錄
========================== */

function renderPersonal(){

  const rank=ranking();

  const me=rank.find(p=>p.id===uid);

  const place=rank.findIndex(p=>p.id===uid)+1;

  let c=0,w=0,m=0;

  for(let i=0;i<10;i++){

    const a=mine(i);
    const q=question(i);

    if(!a)m++;
    else if(a.choice===q.correct)c++;
    else w++;

  }

  $("summary").className="notice";

  $("summary").textContent=
    `🎉 總分 ${(me?.score||0).toLocaleString()} 分｜第 ${place} 名／${rank.length}人\n`+
    `✅答對${c}題　❌答錯${w}題　⏰未答${m}題`;

  $("records").replaceChildren(
    ...Array.from({length:10},(_,i)=>{

      const q=question(i);
      const a=mine(i);

      const d=document.createElement("details");
      const s=document.createElement("summary");
      const body=document.createElement("div");

      d.className="record";

      s.textContent=
        `第${i+1}題　`+
        (!a
          ?"⏰未作答"
          :a.choice===q.correct
          ?"✅答對"
          :"❌答錯"
        )+
        `　${points(a)}分`;

      body.textContent=
        `${q.text}\n`+
        `你的答案：${a?LETTERS[a.choice]+". "+q.options[a.choice]:"未作答"}\n`+
        `正確答案：${LETTERS[q.correct]}. ${q.options[q.correct]}\n`+
        `💡 ${q.explain}`;

      body.style.whiteSpace="pre-line";

      d.append(s,body);

      return d;

    })
  );

}


/* ==========================
   10秒倒數
========================== */

function tick(){

  if(!room || room.phase!=="question")return;

  const t=time(room.questionStartedAt);

  if(!t)return;

  const left=Math.max(
    0,
    10000-(Date.now()-t)
  );

  $("timer").textContent=(left/1000).toFixed(1);

  $("timer").style.color=
    left<=3000?"#ff7b8c":"#ffd06a";

  if(left===0){

    $("options")
      .querySelectorAll("button")
      .forEach(b=>b.disabled=true);

    $("answerInfo").textContent=
      "⏰ 時間到，等待公布答案";

    if(isHost){

      const key=
        room.session+"_"+room.questionIndex;

      if(autoKey!==key && !busy){

        autoKey=key;

        reveal(true).catch(()=>{
          autoKey="";
        });

      }

    }

  }

}


/* ==========================
   玩家作答
========================== */

async function submit(choice){

  if(
    isHost ||
    submitting ||
    mine() ||
    pendingChoice!==null ||
    room?.phase!=="question"
  )return;

  if(Date.now()>=time(room.questionStartedAt)+10000){

    toast("時間到");
    return;

  }

  const s=room.session;
  const i=room.questionIndex;

  pendingChoice=choice;
  submitting=true;

  renderQuestion(question(i));

  try{

    await setDoc(
      aRef(uid,s,i),
      {
        uid,
        session:s,
        questionIndex:i,
        choice,
        submittedAt:serverTimestamp()
      }
    );

    toast("✅ 已送出");

  }catch(e){

    pendingChoice=null;
    error(e);

  }finally{

    submitting=false;

    if(
      room?.session===s &&
      room?.questionIndex===i
    ){
      renderQuestion(question(i));
    }

    pendingChoice=null;

  }

}


/* ==========================
   主持人開始題目
========================== */

async function begin(i){

  if(busy || !isHost)return;

  busy=true;

  try{

    await runTransaction(db,async tx=>{

      const r=ref();

      const snap=await tx.get(r);

      const d=snap.data();

      if(d.hostUid!==uid){
        throw Error("只有主持人可操作");
      }

      if(i===0){

        if(
          d.phase!=="lobby" ||
          players.length<3
        ){
          throw Error("至少3位玩家才能開始");
        }

      }else if(
        d.phase!=="results" ||
        d.questionIndex!==i-1
      ){

        throw Error("目前不能進入下一題");

      }

      tx.update(r,{
        phase:"question",
        questionIndex:i,
        questionStartedAt:serverTimestamp(),
        picks:i===0?picks():d.picks,
        starts:{
          ...d.starts,
          ["q"+i]:serverTimestamp()
        }
      });

    });

    toast(`第${i+1}題開始`);

  }catch(e){

    error(e);

  }finally{

    busy=false;
    render();

  }

}


/* ==========================
   主持人公布答案
========================== */

async function reveal(silent=false){

  if(busy || !isHost)return;

  busy=true;

  try{

    await runTransaction(db,async tx=>{

      const r=ref();

      const snap=await tx.get(r);

      const d=snap.data();

      if(d.phase!=="question")return;

      const ms=time(d.questionStartedAt);

      if(!ms || Date.now()<ms+10000){
        throw Error("尚未滿10秒");
      }

      tx.update(r,{
        phase:"results"
      });

    });

  }catch(e){

    if(!silent){
      error(e);
    }else{
      console.warn("自動公布稍後重試",e);
    }

    throw e;

  }finally{

    busy=false;
    render();

  }

}


/* ==========================
   最終排名
========================== */

async function finish(){

  if(busy || !isHost)return;

  busy=true;

  try{

    await runTransaction(db,async tx=>{

      const r=ref();

      const d=(await tx.get(r)).data();

      if(
        d.phase!=="results" ||
        d.questionIndex!==9
      ){
        throw Error("尚未完成10題");
      }

      tx.update(r,{
        phase:"finished"
      });

    });

  }catch(e){

    error(e);

  }finally{

    busy=false;
    render();

  }

}


/* ==========================
   重新開始
========================== */

async function reset(){

  if(
    !isHost ||
    busy ||
    !confirm("確定重新抽題？玩家本場分數歸零。")
  )return;

  busy=true;

  try{

    await runTransaction(db,async tx=>{

      const r=ref();

      const d=(await tx.get(r)).data();

      tx.update(r,{
        phase:"lobby",
        session:d.session+1,
        questionIndex:-1,
        questionStartedAt:null,
        picks:[],
        starts:{}
      });

    });

    autoKey="";

    toast("已重設，準備新一場");

  }catch(e){

    error(e);

  }finally{

    busy=false;
    render();

  }

}


/* ==========================
   按鈕事件
========================== */

$("start").onclick=()=>begin(0);

$("next").onclick=()=>begin(
  room.questionIndex+1
);

$("reveal").onclick=()=>
  reveal().catch(()=>{});

$("finish").onclick=finish;

$("reset").onclick=reset;


/* ==========================
   分享房間
========================== */

$("share").onclick=async()=>{

  const url=
    location.origin+
    location.pathname+
    "?room="+encodeURIComponent(roomId);

  try{

    if(navigator.share){

      await navigator.share({
        title:"冷知識快問快答",
        url
      });

    }else{

      await navigator.clipboard.writeText(url);

      toast("連結已複製");

    }

  }catch(e){

    if(e.name!=="AbortError"){
      prompt("複製房間連結",url);
    }

  }

};


/* ==========================
   離開遊戲畫面
========================== */

$("leave").onclick=()=>{

  cleanup();

  roomId="";
  room=null;
  players=[];
  answers=[];
  isHost=false;

  show("game",false);
  show("entry",true);

  history.replaceState(
    {},
    "",
    location.pathname
  );

};

</script>
