<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b31">
<title>上新莊冷知識快問快答</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101b31;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif}
header{text-align:center;padding:27px 12px;background:linear-gradient(135deg,#162c4b,#31577f)}
header h1{font-size:26px;margin:0 0 9px}
header p{margin:0;color:#c5d7ea;font-size:14px}
main{max-width:850px;margin:auto;padding:15px}
.card{background:#1b2e49;border:1px solid #354e6e;border-radius:18px;padding:20px;margin-bottom:15px}
h2{font-size:21px;margin:0 0 15px}
h3{font-size:18px;margin:18px 0 10px}
label{display:block;margin:14px 0 7px}
input{width:100%;padding:15px;background:#102039;color:white;border:1px solid #4e698b;border-radius:11px;font-size:17px}
button{border:0;border-radius:11px;padding:14px;min-height:48px;font-size:17px;font-weight:bold;color:white;background:#367bd1;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.full{width:100%}
.gold{background:#f1b74e;color:#14243b}
.green{background:#168d70}
.gray{background:#344e6f}
.hide{display:none!important}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.badge{display:inline-block;background:#345173;border-radius:25px;padding:8px 13px;font-size:14px}
.notice{background:#28415f;border-radius:12px;padding:14px;line-height:1.8}
.muted{color:#bfd0e3;font-size:14px;line-height:1.8}
.center{text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.stat{background:#29415f;border-radius:12px;padding:13px 5px;text-align:center;font-size:13px}
.stat strong{display:block;font-size:24px;color:#ffd071}
.timer{text-align:center;font-size:62px;font-weight:900;color:#ffd071;margin:15px 0}
.timer.urgent{color:#ff6978}
.progress{height:10px;background:#354b67;border-radius:20px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;background:#f1b74e;width:100%}
.question{font-size:24px;font-weight:800;line-height:1.6;margin:20px 0}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{background:#31577f;min-height:90px;padding:16px;text-align:left;line-height:1.6}
.option span{display:block;font-size:24px;margin-bottom:5px}
.option.selected{background:#d69d3e;color:#14243b}
.option.correct{background:#128a6d;color:white}
.option.wrong{background:#b54252;color:white}
.result-good{background:#125f50;border:1px solid #1fb18b}
.result-bad{background:#6b2939;border:1px solid #c65364}
.result-miss{background:#4a4c5e}
.rank{display:grid;grid-template-columns:45px 1fr 100px;align-items:center;gap:10px;padding:14px 6px;border-bottom:1px solid #38516f}
.rank.me{background:#304d70;border-radius:10px}
.rank .place{font-size:22px;text-align:center}
.rank strong{color:#ffd071;text-align:right}
.record{background:#263d59;border-radius:12px;margin-bottom:10px;overflow:hidden}
.record summary{cursor:pointer;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:bold}
.record-content{padding:15px;border-top:1px solid #3c5573;line-height:1.9;font-size:15px}
.correct-text{color:#65e5b4;font-weight:bold}
.wrong-text{color:#ff929e;font-weight:bold}
.score-box{background:linear-gradient(135deg,#29496b,#203851);border:1px solid #607c9b;border-radius:15px;padding:20px;text-align:center;margin:15px 0}
.score-box strong{display:block;font-size:36px;color:#ffd071;margin:8px 0}
.small-button{font-size:14px;padding:10px 13px;min-height:40px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f1b74e;color:#14243b;padding:13px 20px;border-radius:12px;display:none;z-index:30;max-width:90%;text-align:center}
@media(max-width:500px){
header h1{font-size:24px}
.card{padding:16px}
.options{grid-template-columns:1fr}
.option{min-height:65px}
.option span{display:inline;margin-right:12px;font-size:20px}
.question{font-size:21px}
.timer{font-size:50px}
.rank{grid-template-columns:38px 1fr 88px;font-size:14px}
}
</style>
</head>

<body>

<header>
<h1>🧠 上新莊冷知識快問快答</h1>
<p>100題題庫・隨機10題・速度積分挑戰</p>
</header>

<main>

<section id="entry" class="card">
<h2>🎮 加入遊戲</h2>
<div id="connection" class="notice">正在連接 Firebase...</div>

<label>房間代碼</label>
<input id="roomCode" placeholder="例如 QUIZ888" maxlength="20">

<label>你的暱稱</label>
<input id="nickname" placeholder="請輸入姓名" maxlength="16">

<br><br>

<button id="joinBtn" class="gold full" disabled>連線中...</button>

<p class="muted">
第一位建立房間的人會成為主持人，不參賽。<br>
至少3位玩家即可開始。<br>
每場隨機10題，每題10秒，第10題雙倍積分。
</p>
</section>

<div id="game" class="hide">

<section class="card">
<div class="row">
<h2 id="roomTitle">遊戲房間</h2>
<span id="role" class="badge"></span>
</div>

<div id="phaseText" class="notice"></div>

<div class="stats">
<div class="stat"><strong id="playerCount">0</strong>玩家</div>
<div class="stat"><strong id="questionNumber">0/10</strong>題目</div>
<div class="stat"><strong id="answeredCount">0</strong>已作答</div>
</div>

<div class="row">
<button id="shareBtn" class="gray small-button">📤 分享房間</button>
<button id="leaveBtn" class="gray small-button">🚪 離開畫面</button>
</div>
</section>

<section id="hostPanel" class="card hide">
<h2>👑 主持人控制台</h2>
<div id="hostHelp" class="notice"></div>
<br>
<button id="startBtn" class="gold full hide">▶️ 開始第1題</button>
<button id="revealBtn" class="green full hide">📊 公布本題答案</button>
<button id="nextBtn" class="gold full hide">➡️ 下一題</button>
<button id="finishBtn" class="gold full hide">🏆 公布最終排行榜</button>
<br>
<button id="resetBtn" class="gray full">🔄 重新抽題開始新一場</button>
</section>

<section id="questionPanel" class="card hide">
<div class="row">
<span id="qBadge" class="badge"></span>
<span id="doubleBadge" class="badge hide">🔥 雙倍積分</span>
</div>

<div id="timer" class="timer">10.0</div>
<div class="progress"><div id="timerBar"></div></div>

<div id="questionText" class="question"></div>
<div id="options" class="options"></div>
<br>
<div id="answerMessage" class="notice center">請選擇答案</div>
</section>

<section id="resultPanel" class="card hide">
<h2>🎯 本題作答結果</h2>
<div id="correctAnswer" class="notice"></div>
<br>
<div id="myResult" class="notice"></div>
<h3>📊 作答統計</h3>
<div id="answerStats"></div>
<p id="explanation" class="muted"></p>
</section>

<section id="rankPanel" class="card">
<h2 id="rankTitle">🏆 即時排行榜</h2>
<div id="rankList"></div>
</section>

<section id="personalPanel" class="card hide">
<h2>📋 我的10題作答紀錄</h2>
<div id="personalSummary"></div>
<div id="personalRecords"></div>
</section>

<section class="card">
<h2>👥 玩家名單</h2>
<div id="playersList" class="muted"></div>
</section>

</div>
</main>

<div id="toast"></div>
